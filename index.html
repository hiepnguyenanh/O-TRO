          '<p class="ghi">Phần riêng của Ở TRỌ. Mỗi chủ trọ một bot riêng, không dùng chung.</p>'+
          '<div class="luoi-form">'+
            o2('b1','Mã bot',tc.ma_bot_telegram,'Lấy từ BotFather trên Telegram','','password')+
            o2('b2','Trạng thái kết nối',tc.ma_bot_telegram?'Đã khai báo mã bot':'Chưa khai báo mã bot')+
          '</div>'+
          '<div style="margin-top:18px">'+
            batTat('t1','Đọc chỉ số từ ảnh đồng hồ','Quét số trên ảnh rồi chờ người duyệt', tc.ai_doc_chi_so!==false)+
            batTat('t2','Đọc căn cước bằng mã QR','Quét QR mặt sau trước, AI đọc chữ chỉ để dự phòng', tc.ai_doc_can_cuoc!==false)+
            batTat('t3','Bắt buộc duyệt trước khi ghi sổ','Tắt cái này là số Trợ Lý AI đọc vào thẳng hóa đơn. Không nên tắt.', tc.ai_bat_buoc_duyet!==false)+
            batTat('t4','Xóa ảnh căn cước sau 30 ngày','Chỉ giữ lại phần chữ đã duyệt', tc.ai_xoa_anh_30_ngay!==false)+
          '</div>'+
          '<div class="hang-luu">'+nutT('luu-ai','Lưu')+'</div></div>'+

          '<p class="chan" style="margin:0"><span>Tổ chức: '+esc(tc.ten||'—')+'</span>'+
          '<span>Bấm Lưu ở từng khối để ghi vào kho dữ liệu.</span></p>'+
          '</div>';
      }
    }
    el.addEventListener('click', function(e){
      var b=e.target.closest('[data-lam]'); if(!b) return;
      if(b.dataset.lam === 'tao-tk'){ taoTaiKhoan(function(){ moMan('caidat'); }); return; }
      if(b.dataset.lam === 'sua-nd' || b.dataset.lam === 'khoa-nd'){
        var u = nd.filter(function(x){ return x.id === b.dataset.ai; })[0];
        if(!u) return;
        if(b.dataset.lam === 'sua-nd') suaNguoiDung(u, function(){ moMan('caidat'); });
        else khoaNguoiDung(u, function(){ moMan('caidat'); });
        return;
      }
      if(b.dataset.lam === 'pc'){
        var ai = b.dataset.ai;
        var ng = nd.filter(function(x){ return x.id === ai; })[0];
        if(ng) phanCong(ng, nhas, pcTheo[ai] || [], function(){ moMan('caidat'); });
        return;
      }
      luuCaiDat(b, b.dataset.lam, tc);
    });

    veTab(cdTab); noiTab(veTab);
  }).catch(function(e){ el.innerHTML=daiHeader('Cài đặt','','Hệ thống')+baoLoi(e); });
}

/* ---------- Tài khoản người dùng ----------
   Mật khẩu KHÔNG đi qua app này. Chủ trọ tạo tài khoản đăng nhập trong
   Supabase (Authentication → Users → Add user), rồi dán mã User UID vào đây
   để gắn tên và vai trò. */
function taoTaiKhoan(xongThi){
  moHop({
    ten:'Tạo tài khoản',
    mo:'Bước 1 — làm trong Supabase: Authentication → Users → Add user → Create new user → gõ email và mật khẩu cho người đó → '+
       'tích "Auto Confirm User" → Create user. Bấm vào dòng người vừa tạo, chép ô User UID. '+
       'Bước 2 — dán User UID vào ô dưới đây, điền tên và vai trò, bấm Lưu.',
    o:[
      {id:'id', nhan:'User UID (chép từ Supabase)', batBuoc:true, rong:true, goiY:'Dạng 8-4-4-4-12 ký tự, ví dụ 1a2b3c4d-....'},
      {id:'ho_ten', nhan:'Họ và tên', batBuoc:true},
      {id:'email', nhan:'Email đăng nhập', batBuoc:true},
      {id:'sdt', nhan:'Điện thoại'},
      {id:'vai_tro', nhan:'Vai trò', kieu:'chon', gt:'quan_ly',
       chon:[['quan_ly','Quản lý'],['ke_toan','Kế toán'],['chu_tro','Chủ trọ']]}
    ],
    nutLuu:'Lưu tài khoản', xong:'Đã tạo. Người đó đăng nhập bằng email và mật khẩu anh đặt ở Supabase.',
    kiem:function(g){
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(g.id||'').trim()))
        return 'User UID chưa đúng dạng. Chép nguyên ô User UID trong Supabase.';
      if(!g.ho_ten || g.ho_ten.trim().length<2) return 'Chưa điền họ tên.';
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g.email||'')) return 'Email chưa đúng.';
      return null;
    },
    luu:function(g){
      return toChuc().then(function(tc){
        return ghi('nguoi_dung','POST',[{id:g.id.trim().toLowerCase(), to_chuc_id:tc, ho_ten:g.ho_ten.trim(),
          email:g.email.trim(), sdt:g.sdt||null, vai_tro:g.vai_tro, dang_hoat_dong:true}])
          .catch(function(e){
            var m=String(e.message||e);
            if(/trỏ tới thứ không còn tồn tại/.test(m)) throw new Error('Không thấy User UID này trong Supabase. Kiểm tra đã bấm Create user chưa, và chép đúng ô User UID.');
            throw e;
          });
      });
    },
    xongThi:xongThi
  });
}
function suaNguoiDung(u, xongThi){
  var laToi = TOI && TOI.id===u.id;
  moHop({
    ten:'Sửa tài khoản',
    mo:(u.email||'')+(laToi?' — đây là tài khoản anh đang dùng, không tự đổi vai trò hay khóa chính mình được.':''),
    o:[
      {id:'ho_ten', nhan:'Họ và tên', batBuoc:true, gt:u.ho_ten},
      {id:'sdt', nhan:'Điện thoại', gt:u.sdt},
      {id:'vai_tro', nhan:'Vai trò', kieu:'chon', gt:u.vai_tro,
       chon: laToi ? [[u.vai_tro, tenVai(u.vai_tro)]] : [['quan_ly','Quản lý'],['ke_toan','Kế toán'],['chu_tro','Chủ trọ']]},
      {id:'telegram_id', nhan:'Mã Telegram', gt:u.telegram_id, goi:'Để bot Trợ Lý AI nhận ra người này'}
    ],
    nutLuu:'Lưu thay đổi', xong:'Đã lưu tài khoản.',
    kiem:function(g){ return (!g.ho_ten || g.ho_ten.trim().length<2) ? 'Chưa điền họ tên.' : null; },
    luu:function(g){
      return ghi('nguoi_dung?id=eq.'+encodeURIComponent(u.id),'PATCH',{ho_ten:g.ho_ten.trim(), sdt:g.sdt||null,
        vai_tro:laToi?u.vai_tro:g.vai_tro, telegram_id:g.telegram_id||null});
    },
    xongThi:xongThi
  });
}
function khoaNguoiDung(u, xongThi){
  if(TOI && TOI.id===u.id){ banh('Không tự khóa tài khoản mình đang dùng được.'); return; }
  var khoa = u.dang_hoat_dong;
  if(!hoiLai(khoa
      ? 'Khóa tài khoản '+(u.ho_ten||u.email)+'?\n\nNgười này vẫn đăng nhập được nhưng không đọc, không ghi được gì nữa. Mở khóa lại lúc nào cũng được. Dữ liệu người này đã ghi vẫn giữ nguyên.'
      : 'Mở khóa tài khoản '+(u.ho_ten||u.email)+'?')) return;
  ghi('nguoi_dung?id=eq.'+encodeURIComponent(u.id),'PATCH',{dang_hoat_dong:!khoa})
    .then(function(){ banh(khoa?'Đã khóa tài khoản.':'Đã mở khóa tài khoản.'); if(xongThi) xongThi(); })
    .catch(function(e){ banh('Không lưu được: '+(e.message||e)); });
}

/* ---------- Giao căn cho một tài khoản Quản lý ----------
   Bỏ hết rồi ghi lại: đơn giản, không phải so sánh trước sau.
   Không tích căn nào là trả người đó về "thấy tất cả các căn". */
function phanCong(ng, dsNha, dangCo, xongThi){
  if(!dsNha.length){ banh('Chưa có căn nào để giao.'); return; }
  var o = dsNha.map(function(n){
    return { id:'pc_'+n.id, nhan:n.ma_nha+' — '+n.ten_nha, kieu:'batTat',
             gt: dangCo.indexOf(n.id) >= 0 };
  });
  moHop({
    ten:'Phân công căn cho '+(ng.ho_ten||'tài khoản này'),
    mo:'Bật căn nào là người này chỉ còn thấy căn đó: phòng, khách, hợp đồng, '+
       'chỉ số, hóa đơn, thu chi của căn khác đều biến mất. Không bật căn nào là thấy tất cả. '+
       'Dù bật hay không, Quản lý vẫn không xem được tiền thuê sỉ và lãi lỗ.',
    o:o, nutLuu:'Lưu phân công', xong:false,
    luu:function(g){
      var chon = dsNha.filter(function(n){ return g['pc_'+n.id]; });
      return ghi('phan_cong_nha?nguoi_dung_id=eq.'+encodeURIComponent(ng.id), 'DELETE', null, 'return=minimal')
        .then(function(){
          if(!chon.length) return null;
          return toChuc().then(function(tc){
            return ghi('phan_cong_nha','POST', chon.map(function(n){
              return { nguoi_dung_id:ng.id, nha_tro_id:n.id, to_chuc_id:tc }; }));
          });
        })
        .then(function(){
          banh(chon.length
            ? 'Đã giao '+chon.length+' căn cho '+(ng.ho_ten||'tài khoản này')+': '+
              chon.map(function(n){ return n.ma_nha; }).join(', ')+'.'
            : 'Đã bỏ hết phân công. '+(ng.ho_ten||'Tài khoản này')+' xem được tất cả các căn trở lại.');
        });
    },
    xongThi:xongThi
  });
}

/* ---------- Lưu ba khối trong tab Thông tin tài khoản ---------- */
function luuCaiDat(nut, khoi, tc){
  function v(id){ var e=document.getElementById(id); return e ? (e.value.trim()===''?null:e.value.trim()) : null; }
  function b(id){ var e=document.getElementById(id); return e ? !!e.checked : true; }

  var doi = {}, ten = '';
  if(khoi==='luu-canhan'){
    ten='Thông tin cá nhân';
    doi = { ho_ten_chu_tro:v('c1'), sdt:v('c2'), email:v('c3'),
            so_dinh_danh:v('c4'), ngay_cap:v('c5'), noi_cap:v('c6'), noi_thuong_tru:v('c7') };
  } else if(khoi==='luu-nganhang'){
    ten='Tài khoản ngân hàng';
    doi = { chu_tai_khoan:v('n1'), so_tai_khoan:v('n2'), ngan_hang:v('n3') };
    if(doi.so_tai_khoan && !/^[0-9]{6,20}$/.test(doi.so_tai_khoan)){
      banh('Số tài khoản chỉ gồm chữ số, từ 6 đến 20 số. Kiểm tra lại.'); return;
    }
  } else if(khoi==='luu-ai'){
    ten='Trợ Lý AI';
    doi = { ma_bot_telegram:v('b1'),
            ai_doc_chi_so:b('t1'), ai_doc_can_cuoc:b('t2'),
            ai_bat_buoc_duyet:b('t3'), ai_xoa_anh_30_ngay:b('t4') };
    if(!doi.ai_bat_buoc_duyet &&
       !confirm('Tắt "Bắt buộc duyệt" nghĩa là số Trợ Lý AI đọc từ ảnh sẽ vào thẳng hóa đơn, không ai kiểm.\n\nAI đọc nhầm một chữ số là khách trả sai tiền.\n\nVẫn tắt?')){
      var t3=document.getElementById('t3'); if(t3) t3.checked = true;
      return;
    }
  } else return;

  if(!tc || !tc.id){ banh('Chưa đọc được mã tổ chức. Tải lại trang giúp tôi.'); return; }

  nut.disabled = true; var cu = nut.textContent; nut.textContent = 'Đang lưu…';
  ghi('to_chuc?id=eq.'+encodeURIComponent(tc.id), 'PATCH', doi)
    .then(function(){ banh('Đã lưu ' + ten + '.'); Object.assign(tc, doi); })
    .catch(function(er){ banh('Không lưu được: ' + (er.message||er)); })
    .then(function(){ nut.disabled=false; nut.textContent=cu; });
}

var VE = {bang:manBang, nha:manNha, khach:manKhach, banggia:manBangGia, chiso:manChiSo,
          hoadon:manHoaDon, thuchi:manThuChi, baocao:manBaoCao, caidat:manCaiDat};

/* ============ ĐIỀU HƯỚNG ============ */
/* Thay ô nội dung bằng một ô sạch, bỏ hết listener của màn trước.
   Không làm việc này thì nút "Lưu" ở màn Cài đặt sẽ kích hoạt
   hộp "Thêm phiếu chi" của màn Thu chi — lỗi im lặng, rất khó dò. */
function thanMoi(){
  var cu = document.getElementById('than');
  var el = cu.cloneNode(false);
  cu.parentNode.replaceChild(el, cu);
  el.addEventListener('click', function(e){
    if(e.target.closest('[data-hd="chua"]')) chuaBat();
  });
  return el;
}
function moMan(id){
  veMenu(id);
  var el = thanMoi();
  el.scrollTop=0; window.scrollTo(0,0);
  (VE[id]||manBang)(el);
}
document.querySelector('.menu').addEventListener('click', function(e){
  var b=e.target.closest('[data-man]'); if(!b) return;
  moMan(b.dataset.man);
});

/* ============ VÀO / RA ============ */
function hienApp(){
  document.getElementById('man-dn').classList.add('an');
  document.getElementById('app').classList.remove('an');
  docToi().then(function(){ veVaiTro(); moMan('bang'); });
}
function hienDangNhap(loi){
  document.getElementById('app').classList.add('an');
  document.getElementById('man-dn').classList.remove('an');
  var l=document.getElementById('loi-dn');
  if(loi){ l.textContent=loi; l.classList.remove('an'); } else l.classList.add('an');
}
document.getElementById('form-dn').addEventListener('submit', function(e){
  e.preventDefault();
  var nut=document.getElementById('nut-dn'), l=document.getElementById('loi-dn');
  nut.disabled=true; nut.textContent='Đang đăng nhập…'; l.classList.add('an');
  dangNhap(document.getElementById('dn-email').value.trim(),
           document.getElementById('dn-mk').value)
    .then(function(j){ luuPhien(j); document.getElementById('dn-mk').value=''; hienApp(); })
    .catch(function(err){
      var m=String(err.message||err);
      if(/Invalid login/i.test(m)) m='Sai email hoặc mật khẩu.';
      if(/Failed to fetch|NetworkError|load failed/i.test(m))
        m='Không gọi được tới kho dữ liệu. Nếu anh đang mở file trực tiếp từ ổ đĩa, gửi tôi dòng này — tôi sẽ đưa app lên mạng.';
      l.textContent=m; l.classList.remove('an');
    })
    .then(function(){ nut.disabled=false; nut.textContent='Đăng nhập'; });
});
document.getElementById('nut-ra').addEventListener('click', function(){
  xoaPhien(); hienDangNhap(null);
});

if(phien && phien.access_token) hienApp(); else hienDangNhap(null);
})();
