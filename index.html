            '<td><span class="cap-nut">'+nut+'</span></td></tr>';
        }).join('');
      }).join('') || '<tr><td colspan="9" style="color:var(--chu-mo)">Không có hóa đơn nào khớp bộ lọc.</td></tr>';
    }

    el.addEventListener('click', function(e){
      var q=e.target.closest('[data-hl]');
      if(q){
        var h=timHD(q.dataset.id); if(!h) return;
        var v=q.dataset.hl;
        if(v==='xem'){
          hChon=h.id;
          document.querySelectorAll('#tabs-man .tab').forEach(function(x){ x.classList.toggle('dang', x.dataset.tabm==='ct'); });
          veTab('ct'); window.scrollTo(0,0);
        }
        else if(v==='sua')  suaNhap(h, theoHD[h.id]||[], lai);
        else if(v==='phat') phatHanh([h], theoHD, lai);
        else if(v==='thu')  ghiThanhToan(h, lai);
        else if(v==='in')   inPhieuThu([{h:h, dong:theoHD[h.id]||[], tt:ttHD[h.id]||[]}], NH);
        else if(v==='tele') guiTelegram(h, theoHD[h.id]||[], NH);
        else if(v==='huy')  huyHoaDon(h, lai);
        else if(v==='xoanhap'){
          if(!hoiLai('Xóa hẳn bản nháp '+h.so_hoa_don+'?\n\nBản nháp chưa gửi khách, chưa có tiền — xóa không ảnh hưởng số liệu nào.')) return;
          ghi('hoa_don?id=eq.'+encodeURIComponent(h.id)+'&trang_thai=eq.nhap','DELETE',null,'return=minimal')
            .then(function(){ banh('Đã xóa bản nháp '+h.so_hoa_don+'.'); hChon=null; lai(); })
            .catch(function(er){ banh('Không xóa được: '+(er.message||er)); });
        }
        return;
      }
      var b=e.target.closest('[data-lam]'); if(!b) return;
      var L=b.dataset.lam;
      if(L==='tao-hd')  moHopTaoHoaDon(false, nhas);
      if(L==='lap-ky')  moHopTaoHoaDon(true, nhas);
      if(L==='phat-ky') phatHanhCaKy(hs, theoHD, nhas, lai);
      if(L==='xuat-hd') xuatExcelHoaDon(locHD(), theoHD);
      if(L==='in-hd'){
        var dsIn=(hTab==='ct' ? [timHD(hChon)] : locHD()).filter(function(h){ return h && h.trang_thai!=='da_huy'; });
        if(!dsIn.length){ banh('Không có hóa đơn nào để in. Chọn bộ lọc khác.'); return; }
        if(dsIn.length>1 && !hoiLai('In '+dsIn.length+' phiếu thu theo bộ lọc đang chọn (mỗi phiếu một trang)?')) return;
        inPhieuThu(dsIn.map(function(h){ return {h:h, dong:theoHD[h.id]||[], tt:ttHD[h.id]||[]}; }), NH);
      }
      if(L==='tele-hd'){
        var h2=timHD(hChon);
        if(hTab!=='ct' || !h2){ banh('Bấm "Xem" ở hóa đơn cần gửi, rồi bấm Gửi Telegram.'); return; }
        guiTelegram(h2, theoHD[h2.id]||[], NH);
      }
    });

    veTab(hTab); noiTab(veTab);
  }).catch(function(e){ el.innerHTML=daiHeader('Hóa đơn','')+baoLoi(e); });
}

/* ============================================================
   LẬP HÓA ĐƠN (ra BẢN NHÁP)
   Tiền phòng lấy từ hợp đồng. Điện nước lấy từ chỉ số ĐÃ DUYỆT.
   Hạn thanh toán: ngày đóng tiền trong hợp đồng (thường là 05) của THÁNG SAU kỳ.
   ============================================================ */
function dsKy(){
  var a=[], d=new Date(Date.now()+7*3600*1000);
  for(var i=0;i<6;i++){
    var t=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()-i, 1));
    var k=t.getUTCFullYear()+'-'+('0'+(t.getUTCMonth()+1)).slice(-2)+'-01';
    a.push([k, 'Tháng '+nhanKy(k)]);
  }
  return a;
}
function hanThangSau(ky, ngayDong){
  var y=+String(ky).slice(0,4), m=+String(ky).slice(5,7)+1;
  if(m>12){ m=1; y++; }
  var cuoi=new Date(Date.UTC(y, m, 0)).getUTCDate();
  var d=Math.min(Math.max(1, Number(ngayDong)||5), cuoi);
  return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
}

function moHopTaoHoaDon(caKy, nhas){
  moHop({
    ten: caKy ? 'Lập nháp hóa đơn cả kỳ' : 'Tạo hóa đơn một phòng',
    mo: (caKy
      ? 'Lập BẢN NHÁP cho mọi phòng đang thuê (hoặc chỉ một nhà) mà kỳ đó chưa có hóa đơn. Phòng thiếu chỉ số điện đã duyệt sẽ bị bỏ qua và liệt kê riêng.'
      : 'Lập BẢN NHÁP cho một phòng. Cần có chỉ số điện đã duyệt của kỳ đó — chưa có thì vào menu Chỉ số điện nước gõ vào.')+
      ' Bản nháp sửa được mọi mục; kiểm tra xong bấm Phát hành.',
    o: [
      {id:'ky', nhan:'Kỳ hóa đơn', kieu:'chon', chon:dsKy(), gt:kyHienTai(), batBuoc:true, rong:!caKy},
      {id:'nha', nhan:'Nhà trọ', kieu:'chon', chon:[['','Tất cả các nhà']].concat((nhas||[]).map(function(n){ return [n.ma_nha,'Nhà trọ '+n.ma_nha]; }))},
      {id:'phong_id', nhan:'Phòng', kieu:'chon', chon:[['','Đang tải danh sách…']], rong:true},
      {id:'han', nhan:'Hạn thanh toán', kieu:'ngay',
       goi:'Để trống = ngày 05 tháng sau kỳ (theo ngày đóng tiền trong hợp đồng)'}
    ].filter(function(x){ return caKy ? x.id!=='phong_id' : x.id!=='nha'; }),
    nutLuu: caKy ? 'Lập nháp' : 'Lập bản nháp',
    xong: false,
    kiem:function(g){
      if(!g.ky) return 'Chưa chọn kỳ.';
      if(!caKy && !g.phong_id) return 'Chưa chọn phòng.';
      return null;
    },
    luu:function(g){ return lapHoaDon(g.ky, caKy ? null : g.phong_id, g.han, caKy ? g.nha : null); },
    xongThi:function(){ hLoc.tt='nhap'; hTab='ds'; moMan('hoadon'); }
  });

  if(!caKy){
    lay('v_phong?select=id,ma_nha,ma_phong,khach_thue,trang_thai&order=ma_nha,ma_phong')
      .then(function(ps){
        var o=document.getElementById('f-phong_id'); if(!o) return;
        var dt=ps.filter(function(p){ return p.trang_thai==='dang_thue'; });
        o.innerHTML = dt.length
          ? dt.map(function(p){
              return '<option value="'+esc(p.id)+'">'+esc(p.ma_nha+' '+p.ma_phong+
                (p.khach_thue?' — '+p.khach_thue:''))+'</option>'; }).join('')
          : '<option value="">Không có phòng nào đang thuê</option>';
      }).catch(function(){});
  }
}

/* Lập bản nháp. phongId = null nghĩa là cả kỳ; maNha lọc riêng một nhà. */
function lapHoaDon(ky, phongId, hanTay, maNha){
  return Promise.all([
    toChuc(),
    lay('v_phong?select=*&order=ma_nha,ma_phong'),
    lay('hop_dong?select=*&trang_thai=in.(hieu_luc,sap_het_han)'),
    lay('chi_so?select=phong_id,loai_dich_vu,chi_so_cu,chi_so_moi&ky=eq.'+ky+'&trang_thai_duyet=eq.da_duyet'),
    lay('bang_gia?select=id,nha_tro_id,ngay_ap_dung&order=ngay_ap_dung.desc'),
    lay('bang_gia_dong?select=*'),
    lay('hoa_don?select=id,phong_id,ky,con_no,trang_thai,so_hoa_don')
  ]).then(function(k){
    var tc=k[0], ps=k[1], hds=k[2], cs=k[3], bgs=k[4], bgd=k[5], hoadon=k[6];

    var hdTheoPhong={}; hds.forEach(function(h){ hdTheoPhong[h.phong_id]=h; });
    var csTheoPhong={}; cs.forEach(function(c){
      (csTheoPhong[c.phong_id]=csTheoPhong[c.phong_id]||{})[c.loai_dich_vu]=c; });
    var dongTheoBg={}; bgd.forEach(function(d){
      (dongTheoBg[d.bang_gia_id]=dongTheoBg[d.bang_gia_id]||[]).push(d); });
    /* Hóa đơn đã hủy không chặn việc lập lại */
    var daCo={}, soDaDung={};
    hoadon.forEach(function(h){
      soDaDung[h.so_hoa_don]=1;
      if(String(h.ky)===ky && h.trang_thai!=='da_huy') daCo[h.phong_id]=true; });
    function soMoi(maN, maP){
      var goc=soHoaDonMoi(maN, maP, ky), s=goc, i=2;
      while(soDaDung[s]){ s=goc+'-L'+i; i++; }
      soDaDung[s]=1; return s;
    }

    function bangGiaCho(nhaId){
      var hop = bgs.filter(function(b){
        return (b.nha_tro_id===nhaId || b.nha_tro_id===null) && String(b.ngay_ap_dung)<=ky;
      });
      hop.sort(function(a,b){
        if(a.nha_tro_id && !b.nha_tro_id) return -1;
        if(!a.nha_tro_id && b.nha_tro_id) return 1;
        return String(b.ngay_ap_dung).localeCompare(String(a.ngay_ap_dung));
      });
      return hop.length ? (dongTheoBg[hop[0].id]||[]) : [];
    }

    var chon = ps.filter(function(p){
      if(p.trang_thai!=='dang_thue') return false;
      if(phongId) return p.id===phongId;
      if(maNha && p.ma_nha!==maNha) return false;
      return !daCo[p.id];
    });
    if(!chon.length)
      throw new Error(phongId
        ? 'Phòng này không đang thuê.'
        : 'Kỳ '+nhanKy(ky)+(maNha?' của nhà '+maNha:'')+' đã có hóa đơn cho mọi phòng đang thuê. Không còn gì để lập.');

    var xong=[], bo=[], thieuNuoc=[];
    var viec = chon.map(function(p){
      if(daCo[p.id] && phongId) { bo.push(p.ma_nha+' '+p.ma_phong+': kỳ này đã có hóa đơn (muốn lập lại thì hủy hóa đơn cũ trước)'); return null; }
      var hd = hdTheoPhong[p.id];
      if(!hd){ bo.push(p.ma_nha+' '+p.ma_phong+': không tìm thấy hợp đồng hiệu lực'); return null; }
      var so = csTheoPhong[p.id] || {};
      if(!so.dien){ bo.push(p.ma_nha+' '+p.ma_phong+': chưa có chỉ số điện đã duyệt'); return null; }

      var gia = bangGiaCho(p.nha_tro_id);
      function donGia(loai){
        var d = gia.filter(function(x){ return x.loai_dich_vu===loai; })[0];
        return d ? d : null;
      }

      var dong=[], tienDichVu=0;
      var tienPhong = Number(hd.gia_thue)||0;
      dong.push({ dien_giai:'Tiền phòng tháng '+nhanKy(ky), so_luong:1,
                  don_gia:tienPhong, thanh_tien:tienPhong });

      var gd = donGia('dien');
      if(gd){
        var tt = Math.max(0, Number(so.dien.chi_so_moi) - Number(so.dien.chi_so_cu||0));
        var th = Math.round(tt*Number(gd.don_gia));
        tienDichVu += th;
        dong.push({ loai_dich_vu:'dien', dien_giai:'Tiền điện tháng '+nhanKy(ky),
                    chi_so_cu:so.dien.chi_so_cu, chi_so_moi:so.dien.chi_so_moi,
                    so_luong:tt, don_gia:Number(gd.don_gia), thanh_tien:th });
      }

      var gn = donGia('nuoc');
      var giaNuoc = Number(hd.don_gia_nuoc)>0 ? Number(hd.don_gia_nuoc) : (gn?Number(gn.don_gia):0);
      var cachNuoc = hd.cach_tinh_nuoc || (gn?gn.cach_tinh:'theo_chi_so');
      if(giaNuoc>0){
        var sl=0, ccu=null, cmoi=null;
        if(cachNuoc==='theo_chi_so'){
          if(so.nuoc){
            ccu=so.nuoc.chi_so_cu; cmoi=so.nuoc.chi_so_moi;
            sl=Math.max(0, Number(cmoi)-Number(ccu||0));
          } else {
            sl=0; thieuNuoc.push(p.ma_nha+' '+p.ma_phong);
          }
        } else if(cachNuoc==='theo_dau_nguoi'){ sl=Number(p.so_nguoi_o)||1; }
        else { sl=1; }
        if(sl>0){
          var thn=Math.round(sl*giaNuoc); tienDichVu+=thn;
          dong.push({ loai_dich_vu:'nuoc', dien_giai:'Tiền nước tháng '+nhanKy(ky),
                      chi_so_cu:ccu, chi_so_moi:cmoi, so_luong:sl,
                      don_gia:giaNuoc, thanh_tien:thn });
        }
      }

      ['internet','rac','gui_xe','dich_vu_khac'].forEach(function(loai){
        var g = donGia(loai); if(!g || !(Number(g.don_gia)>0)) return;
        var sl = g.cach_tinh==='theo_dau_nguoi' ? (Number(p.so_nguoi_o)||1) : 1;
        var th = Math.round(sl*Number(g.don_gia)); tienDichVu += th;
        dong.push({ loai_dich_vu:loai, dien_giai:(g.ten_hien_thi||loai)+' tháng '+nhanKy(ky),
                    so_luong:sl, don_gia:Number(g.don_gia), thanh_tien:th });
      });

      /* nợ kỳ trước: chỉ hóa đơn đã phát hành còn nợ */
      var noTruoc = hoadon.filter(function(h){
        return h.phong_id===p.id && String(h.ky)<ky && Number(h.con_no)>0 &&
               (h.trang_thai==='cho_thanh_toan' || h.trang_thai==='qua_han');
      }).reduce(function(a,h){ return a+Number(h.con_no); },0);

      var han = hanTay || hanThangSau(ky, hd.ngay_thanh_toan);
      return {
        to_chuc_id:tc, so_hoa_don: soMoi(p.ma_nha, p.ma_phong),
        hop_dong_id:hd.id, phong_id:p.id, ky:ky,
        ngay_phat_hanh: homNayVN(), han_thanh_toan: han,
        tien_phong:tienPhong, tien_dich_vu:tienDichVu, khau_tru:0,
        no_ky_truoc:noTruoc, tong_tien: tienPhong+tienDichVu+noTruoc,
        da_thanh_toan:0, trang_thai:'nhap',
        _dong:dong, _ten:p.ma_nha+' '+p.ma_phong
      };
    }).filter(Boolean);

    if(!viec.length)
      throw new Error('Không lập được hóa đơn nào.\n' + bo.join('\n'));

    return viec.reduce(function(chuoi, v){
      return chuoi.then(function(){
        var dong = v._dong, ten = v._ten;
        var than = {}; for(var kk in v) if(kk.charAt(0)!=='_') than[kk]=v[kk];
        var idMoi = null;
        return ghi('hoa_don','POST',[than]).then(function(kq){
          idMoi = kq && kq[0] && kq[0].id;
          if(!idMoi) throw new Error(ten+': lưu được hóa đơn nhưng không lấy được mã.');
          /* Máy chủ bắt MỌI dòng gửi cùng lúc phải có đúng cùng một bộ cột */
          return ghi('hoa_don_dong','POST', chuanDong(dong, idMoi));
        }).then(function(){ xong.push(ten+' — '+tien(v.tong_tien)+' đ'); })
          .catch(function(e){
            var goRac = idMoi
              ? ghi('hoa_don?id=eq.'+encodeURIComponent(idMoi),'DELETE',null,'return=minimal')
                  .catch(function(){ bo.push(ten+': KHÔNG gỡ được hóa đơn lỗi, báo chủ trọ xóa tay'); })
              : Promise.resolve();
            return goRac.then(function(){ bo.push(ten+': '+(e.message||e)); });
          });
      });
    }, Promise.resolve()).then(function(){
      if(!xong.length) throw new Error('Không lập được hóa đơn nào.\n'+bo.join('\n'));
      var m = 'Đã lập '+xong.length+' BẢN NHÁP. Kiểm tra từng hóa đơn rồi bấm Phát hành.';
      if(thieuNuoc.length) m += ' Chưa tính tiền nước cho '+thieuNuoc.length+
        ' phòng vì thiếu chỉ số nước đã duyệt ('+thieuNuoc.slice(0,3).join(', ')+
        (thieuNuoc.length>3?'…':'')+').';
      if(bo.length) m += ' Bỏ qua '+bo.length+' phòng: '+bo.slice(0,3).join('; ')+
                         (bo.length>3?'…':'')+' Thiếu chỉ số thì vào menu Chỉ số điện nước gõ rồi lập lại.';
      banh(m);
    });
  });
}
var COT_DONG = ['hoa_don_id','loai_dich_vu','dien_giai','chi_so_cu','chi_so_moi','so_luong','don_gia','thanh_tien'];
function chuanDong(dong, idHD){
  return dong.map(function(d){
    var r={}; COT_DONG.forEach(function(c){ r[c] = (d[c]===undefined || d[c]==='') ? null : d[c]; });
    r.hoa_don_id=idHD; return r;
  });
}

/* ---------- Sửa bản nháp: sửa được MỌI mục ---------- */
var LOAI_DONG=[['','Tiền phòng'],['dien','Điện'],['nuoc','Nước'],['internet','Internet'],
               ['rac','Đổ rác'],['gui_xe','Gửi xe'],['dich_vu_khac','Dịch vụ khác']];
function suaNhap(h, dongCu, xongThi){
  if(h.trang_thai!=='nhap'){ banh('Chỉ sửa được bản nháp. Hóa đơn đã phát hành thì Hủy rồi lập lại.'); return; }
  function oSo(cls, v){ return '<input class="'+cls+'" type="number" inputmode="decimal" step="any" value="'+(v==null?'':esc(v))+'">'; }
  function hang(d){
    return '<tr>'+
      '<td><select class="d-loai">'+LOAI_DONG.map(function(x){
        return '<option value="'+x[0]+'"'+((d.loai_dich_vu||'')===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('')+'</select></td>'+
      '<td><input class="d-dg" type="text" value="'+esc(d.dien_giai||'')+'"></td>'+
      '<td>'+oSo('d-cu',d.chi_so_cu)+'</td><td>'+oSo('d-moi',d.chi_so_moi)+'</td>'+
      '<td>'+oSo('d-sl',d.so_luong)+'</td><td>'+oSo('d-gia',d.don_gia)+'</td>'+
      '<td class="phai d-tt">'+tien(d.thanh_tien)+'</td>'+
      '<td><button class="nut-tt xoa" type="button" data-bo-dong title="Bỏ dòng này">✕</button></td></tr>';
  }
  var che=document.createElement('div'); che.className='man-che';
  che.innerHTML='<div class="hop rong" role="dialog" aria-modal="true" aria-label="Sửa bản nháp">'+
    '<div class="hop-dau"><h2>Sửa bản nháp '+esc(h.so_hoa_don)+'</h2>'+
    '<p>'+esc(maNhaHD(h)+' '+maPhongHD(h)+' · '+tenKhachHD(h)+' · kỳ '+nhanKy(h.ky))+
    '. Sửa chỉ số thì số lượng tự tính lại; thành tiền = số lượng × đơn giá. Sửa ở đây không đổi chỉ số trong menu Chỉ số điện nước.</p></div>'+
    '<div class="hop-than"><div class="hop-loi an" id="hop-loi"></div>'+
      '<div class="cuon"><table class="bang-sua"><thead><tr><th>Loại</th><th>Diễn giải</th><th>Chỉ số cũ</th><th>Chỉ số mới</th>'+
      '<th>Số lượng</th><th>Đơn giá</th><th class="phai">Thành tiền</th><th></th></tr></thead>'+
      '<tbody id="sn-dong">'+dongCu.map(hang).join('')+'</tbody></table></div>'+
      '<button class="nut phu" type="button" id="sn-them" style="margin:10px 0 16px">+ Thêm dòng</button>'+
      '<div class="luoi-form">'+
        oNhap({id:'sn_han', nhan:'Hạn thanh toán', kieu:'ngay', gt:h.han_thanh_toan?String(h.han_thanh_toan).slice(0,10):''})+
        oNhap({id:'sn_no', nhan:'Nợ kỳ trước (đồng)', kieu:'so', gt:Number(h.no_ky_truoc)||0})+
        oNhap({id:'sn_kt', nhan:'Khấu trừ (đồng)', kieu:'so', gt:Number(h.khau_tru)||0})+
        oNhap({id:'sn_lykt', nhan:'Lý do khấu trừ', gt:h.ly_do_khau_tru||''})+
        oNhap({id:'sn_gc', nhan:'Ghi chú trên hóa đơn', kieu:'dai', rong:true, gt:h.ghi_chu||''})+
      '</div>'+
      '<p class="tong-nhap">Tổng cộng: <b id="sn-tong">'+tien(h.tong_tien)+' đ</b></p>'+
    '</div>'+
    '<div class="hop-chan"><button class="nut phu" type="button" id="hop-thoi">Thôi</button>'+
    '<button class="nut" type="button" id="hop-luu">Lưu bản nháp</button></div></div>';
  document.body.appendChild(che);
  var tb=che.querySelector('#sn-dong'), oLoi=che.querySelector('#hop-loi');
  function dong(){ che.remove(); document.removeEventListener('keydown', phim); }
  function phim(e){ if(e.key==='Escape') dong(); }
  document.addEventListener('keydown', phim);
  che.querySelector('#hop-thoi').addEventListener('click', dong);
  function so(el){ var v=el.value.trim(); return v==='' ? null : Number(v); }
  function docDong(){
    return Array.prototype.map.call(tb.querySelectorAll('tr'), function(tr){
      return { loai_dich_vu: tr.querySelector('.d-loai').value || null,
               dien_giai: tr.querySelector('.d-dg').value.trim(),
               chi_so_cu: so(tr.querySelector('.d-cu')), chi_so_moi: so(tr.querySelector('.d-moi')),
               so_luong: so(tr.querySelector('.d-sl')), don_gia: so(tr.querySelector('.d-gia')), _tr:tr };
    });
  }
  function tinh(e){
    var tong=0;
    docDong().forEach(function(d){
      var tr=d._tr;
      if(e && (e.target.classList.contains('d-cu')||e.target.classList.contains('d-moi')) && e.target.closest('tr')===tr
         && d.chi_so_cu!=null && d.chi_so_moi!=null){
        d.so_luong=Math.max(0, d.chi_so_moi-d.chi_so_cu); tr.querySelector('.d-sl').value=d.so_luong;
      }
      var th=Math.round((d.so_luong||0)*(d.don_gia||0));
      tr.querySelector('.d-tt').textContent=tien(th); tong+=th;
    });
    tong += (Number(che.querySelector('#f-sn_no').value)||0) - (Number(che.querySelector('#f-sn_kt').value)||0);
    che.querySelector('#sn-tong').textContent=tien(tong)+' đ';
    return tong;
  }
  che.addEventListener('input', tinh);
  che.addEventListener('change', tinh);
  che.addEventListener('click', function(e){
    var b=e.target.closest('[data-bo-dong]'); if(b){ b.closest('tr').remove(); tinh(); }
  });
  che.querySelector('#sn-them').addEventListener('click', function(){
    tb.insertAdjacentHTML('beforeend', hang({loai_dich_vu:'dich_vu_khac', dien_giai:'', so_luong:1, don_gia:0, thanh_tien:0}));
    tb.lastElementChild.querySelector('.d-dg').focus();
  });
  var nutLuu=che.querySelector('#hop-luu');
  nutLuu.addEventListener('click', function(){
    var ds=docDong(), loi=null;
    if(!ds.length) loi='Hóa đơn phải có ít nhất một dòng.';
    ds.forEach(function(d,i){
      if(loi) return;
      if(!d.dien_giai) loi='Dòng '+(i+1)+' chưa có diễn giải.';
      else if(d.so_luong==null || d.so_luong<0) loi='Dòng '+(i+1)+': số lượng chưa đúng.';
      else if(d.don_gia==null || d.don_gia<0) loi='Dòng '+(i+1)+': đơn giá chưa đúng.';
    });
    var han=che.querySelector('#f-sn_han').value;
    if(!loi && !han) loi='Chưa có hạn thanh toán.';
    var no=Number(che.querySelector('#f-sn_no').value)||0, kt=Number(che.querySelector('#f-sn_kt').value)||0;
    var lykt=che.querySelector('#f-sn_lykt').value.trim();
    if(!loi && kt>0 && !lykt) loi='Có khấu trừ thì ghi lý do khấu trừ.';
    if(loi){ oLoi.textContent=loi; oLoi.classList.remove('an'); return; }
    oLoi.classList.add('an');
    var tp=0, dv=0;
    var moi=ds.map(function(d){
      var th=Math.round(d.so_luong*d.don_gia);
      if(d.loai_dich_vu) dv+=th; else tp+=th;
      return {loai_dich_vu:d.loai_dich_vu, dien_giai:d.dien_giai, chi_so_cu:d.chi_so_cu,
              chi_so_moi:d.chi_so_moi, so_luong:d.so_luong, don_gia:d.don_gia, thanh_tien:th};
    });
    var tong=tp+dv+no-kt;
    if(tong<0){ oLoi.textContent='Tổng cộng bị âm. Kiểm tra lại khấu trừ.'; oLoi.classList.remove('an'); return; }
    nutLuu.disabled=true; nutLuu.textContent='Đang lưu…';
    var idCu=dongCu.map(function(d){ return d.id; });
    /* Ghi dòng mới trước, rồi mới gỡ dòng cũ — lỗi giữa chừng không làm mất dòng */
    ghi('hoa_don_dong','POST', chuanDong(moi, h.id))
      .then(function(){
        return idCu.length ? ghi('hoa_don_dong?id=in.('+idCu.join(',')+')','DELETE',null,'return=minimal') : null;
      })
      .then(function(){
        return ghi('hoa_don?id=eq.'+encodeURIComponent(h.id)+'&trang_thai=eq.nhap','PATCH',{
          han_thanh_toan:han, tien_phong:tp, tien_dich_vu:dv, no_ky_truoc:no,
          khau_tru:kt, ly_do_khau_tru:lykt||null, tong_tien:tong,
          ghi_chu:che.querySelector('#f-sn_gc').value.trim()||null });
      })
      .then(function(){ dong(); banh('Đã lưu bản nháp '+h.so_hoa_don+' — tổng '+tien(tong)+' đ.'); if(xongThi) xongThi(); })
      .catch(function(e){
        oLoi.textContent='Không lưu được: '+(e.message||e); oLoi.classList.remove('an');
        nutLuu.disabled=false; nutLuu.textContent='Lưu bản nháp';
      });
  });
}

/* ---------- Phát hành: nháp → hóa đơn thật ---------- */
function phatHanh(ds, theoHD, xongThi){
  ds=ds.filter(function(h){ return h.trang_thai==='nhap'; });
  if(!ds.length){ banh('Không có bản nháp nào để phát hành.'); return Promise.resolve(); }
  var rong=ds.filter(function(h){ return !(theoHD[h.id]||[]).length; });
  if(rong.length){ banh('Có '+rong.length+' bản nháp chưa có dòng nào ('+rong.slice(0,3).map(function(h){return h.so_hoa_don;}).join(', ')+'). Sửa hoặc xóa trước khi phát hành.'); return Promise.resolve(); }
  var tong=ds.reduce(function(a,h){ return a+Number(h.tong_tien); },0);
  if(!hoiLai('Phát hành '+ds.length+' hóa đơn, tổng '+tien(tong)+' đ?\n\n'+
     'Phát hành xong là thành hóa đơn thật: vào công nợ, thu tiền được. '+
     'Muốn sửa sau đó thì phải Hủy và lập lại.')) return Promise.resolve();
  var ids=ds.map(function(h){ return h.id; }), phan=[];
  for(var i=0;i<ids.length;i+=50) phan.push(ids.slice(i,i+50));
  return phan.reduce(function(c,p){
    return c.then(function(){
      return ghi('hoa_don?trang_thai=eq.nhap&id=in.('+p.join(',')+')','PATCH',
                 {trang_thai:'cho_thanh_toan', ngay_phat_hanh:homNayVN()},'return=minimal');
    });
  }, Promise.resolve())
    .then(function(){ banh('Đã phát hành '+ds.length+' hóa đơn. Giờ thu tiền được.'); if(xongThi) xongThi(); })
    .catch(function(e){ banh('Không phát hành được: '+(e.message||e)); });
}

function phatHanhCaKy(hs, theoHD, nhas, xongThi){
  var nhap=hs.filter(function(h){ return h.trang_thai==='nhap'; });
  if(!nhap.length){ banh('Chưa có bản nháp nào. Bấm "Lập nháp cả kỳ" trước.'); return; }
  var kys={}; nhap.forEach(function(h){ kys[String(h.ky).slice(0,10)]=1; });
  var dsK=Object.keys(kys).sort().reverse();
  function dem(ky, nha){
    var d=nhap.filter(function(h){ return String(h.ky).slice(0,10)===ky && (!nha || maNhaHD(h)===nha); });
    var theoNha={}; d.forEach(function(h){ var m=maNhaHD(h); theoNha[m]=theoNha[m]||{n:0,t:0}; theoNha[m].n++; theoNha[m].t+=+h.tong_tien; });
    return {ds:d, txt: d.length ? Object.keys(theoNha).sort().map(function(m){
      return 'Nhà trọ '+m+': '+theoNha[m].n+' hóa đơn · '+tien(theoNha[m].t)+' đ'; }).join('\n') : 'Không có bản nháp nào khớp.'};
  }
  moHop({
    ten:'Phát hành cả kỳ',
    mo:'Chọn kỳ và nhà trọ. Mọi BẢN NHÁP khớp sẽ thành hóa đơn thật. Nên kiểm tra từng nhà rồi phát hành từng nhà.',
    o:[
      {id:'ky', nhan:'Kỳ', kieu:'chon', chon:dsK.map(function(k){ return [k,'Tháng '+nhanKy(k)]; }), gt:dsK[0]},
      {id:'nha', nhan:'Nhà trọ', kieu:'chon', chon:[['','Tất cả các nhà']].concat(nhas.map(function(n){ return [n.ma_nha,'Nhà trọ '+n.ma_nha]; }))},
      {id:'xem', nhan:'Sẽ phát hành', kieu:'dai', rong:true}
    ],
    nutLuu:'Phát hành', xong:false,
    moXong:function(che){
      var o=che.querySelector('#f-xem'); o.readOnly=true; o.rows=5;
      function cap(){ o.value=dem(che.querySelector('#f-ky').value, che.querySelector('#f-nha').value).txt; }
      che.querySelector('#f-ky').addEventListener('change',cap);
      che.querySelector('#f-nha').addEventListener('change',cap);
      cap();
    },
    kiem:function(g){ return dem(g.ky, g.nha).ds.length ? null : 'Không có bản nháp nào khớp kỳ và nhà đã chọn.'; },
    luu:function(g){ return phatHanh(dem(g.ky, g.nha).ds, theoHD, null); },
    xongThi:xongThi
  });
}

/* ---------- Hủy hóa đơn đã phát hành ---------- */
function huyHoaDon(h, xongThi){
  if(Number(h.da_thanh_toan)>0){
    banh('Hóa đơn này đã thu '+tien(h.da_thanh_toan)+' đ. Vào Thu chi → Lịch sử thanh toán, xóa lần thu tiền trước, rồi mới hủy được.');
    return;
  }
  moHop({
    ten:'Hủy hóa đơn '+h.so_hoa_don,
    mo:'Hủy xong: hóa đơn không còn trong công nợ, không thu tiền được. Muốn làm lại thì bấm Tạo hóa đơn, chọn lại phòng '+
       maNhaHD(h)+' '+maPhongHD(h)+', sửa bản nháp rồi Phát hành. Không mở lại được hóa đơn đã hủy.',
    o:[{id:'ly_do', nhan:'Vì sao hủy', kieu:'dai', rong:true, batBuoc:true,
        goiY:'Ví dụ: sai chỉ số điện, tính thiếu tiền rác'}],
    nutLuu:'Hủy hóa đơn', xong:'Đã hủy. Bấm Tạo hóa đơn để lập lại cho phòng này.',
    kiem:function(v){ return (!v.ly_do || v.ly_do.trim().length<5) ? 'Viết một câu lý do.' : null; },
    luu:function(v){
      return ghi('hoa_don?id=eq.'+encodeURIComponent(h.id),'PATCH',{trang_thai:'da_huy', ly_do_huy:v.ly_do.trim()});
    },
    xongThi:xongThi
  });
}

/* ---------- Xuất danh sách hóa đơn đang lọc ra Excel ---------- */
function xuatExcelHoaDon(ds, theoHD){
  if(!ds.length){ banh('Không có hóa đơn nào khớp bộ lọc để xuất.'); return; }
  var s1=[['Số hóa đơn','Kỳ','Nhà','Phòng','Khách thuê','Ngày phát hành','Hạn','Tiền phòng','Tiền dịch vụ',
           'Nợ kỳ trước','Khấu trừ','Tổng tiền','Đã thu','Còn nợ','Trạng thái']];
  var s2=[['Số hóa đơn','Nhà','Phòng','Diễn giải','Chỉ số cũ','Chỉ số mới','Số lượng','Đơn giá','Thành tiền']];
  ds.forEach(function(h){
    s1.push([h.so_hoa_don, nhanKy(h.ky), maNhaHD(h), maPhongHD(h), tenKhachHD(h), ngay(h.ngay_phat_hanh),
      ngay(h.han_thanh_toan), +h.tien_phong, +h.tien_dich_vu, +h.no_ky_truoc, +h.khau_tru, +h.tong_tien,
      +h.da_thanh_toan, +h.con_no, (TT_HD[trangThaiHD(h)]||[''])[0]]);
    (theoHD[h.id]||[]).forEach(function(d){
      s2.push([h.so_hoa_don, maNhaHD(h), maPhongHD(h), d.dien_giai,
        d.chi_so_cu==null?'':+d.chi_so_cu, d.chi_so_moi==null?'':+d.chi_so_moi,
        +d.so_luong, +d.don_gia, +d.thanh_tien]);
    });
  });
  xuatXlsx([['Hóa đơn', s1], ['Chi tiết từng dòng', s2]],
    'O-TRO-hoa-don'+(hLoc.nha?'-'+hLoc.nha:'')+(hLoc.ky?'-'+nhanKy(hLoc.ky).replace('/','-'):'')+'.xlsx');
  banh('Đã xuất '+ds.length+' hóa đơn ra file Excel.');
}

/* ---------- Gửi hóa đơn qua Telegram (hoặc dán vào Zalo) ---------- */
function noiDungGui(h, dong, NH){
  var l=['Ở TRỌ — HÓA ĐƠN TIỀN NHÀ kỳ '+nhanKy(h.ky),
         'Phòng '+maNhaHD(h)+' '+maPhongHD(h)+' — '+tenKhachHD(h),
         'Số: '+h.so_hoa_don, ''];
  dong.forEach(function(d){
    l.push('• '+d.dien_giai+(d.chi_so_cu!=null||d.chi_so_moi!=null
      ? ' ('+(d.chi_so_cu==null?'—':tien(d.chi_so_cu))+' → '+(d.chi_so_moi==null?'—':tien(d.chi_so_moi))+', '+tien(d.so_luong)+' × '+tien(d.don_gia)+')'
      : (Number(d.so_luong)!==1?' ('+tien(d.so_luong)+' × '+tien(d.don_gia)+')':''))+': '+tien(d.thanh_tien)+' đ');
  });
  if(+h.no_ky_truoc) l.push('• Nợ kỳ trước: '+tien(h.no_ky_truoc)+' đ');
  if(+h.khau_tru) l.push('• Khấu trừ'+(h.ly_do_khau_tru?' ('+h.ly_do_khau_tru+')':'')+': −'+tien(h.khau_tru)+' đ');
  l.push('', 'TỔNG CỘNG: '+tien(h.tong_tien)+' đ');
  if(+h.da_thanh_toan) l.push('Đã trả: '+tien(h.da_thanh_toan)+' đ — Còn phải trả: '+tien(h.con_no)+' đ');
  l.push('Hạn đóng: '+ngay(h.han_thanh_toan));
  if(NH && NH.so_tai_khoan)
    l.push('Chuyển khoản: '+(NH.ngan_hang||'')+' · '+NH.so_tai_khoan+(NH.chu_tai_khoan?' · '+NH.chu_tai_khoan:'')+
           ' · Nội dung: '+h.so_hoa_don);
  return l.join('\n');
}
function guiTelegram(h, dong, NH){
  if(h.trang_thai==='nhap'){ banh('Bản nháp chưa gửi khách được. Phát hành trước.'); return; }
  if(h.trang_thai==='da_huy'){ banh('Hóa đơn đã hủy, không gửi.'); return; }
  var txt=noiDungGui(h, dong, NH);
  try{ if(navigator.clipboard) navigator.clipboard.writeText(txt); }catch(e){}
  moXem('Gửi hóa đơn '+h.so_hoa_don, 'Nội dung đã chép sẵn. Bấm "Mở Telegram" để chọn người nhận — hoặc mở Zalo rồi dán (Ctrl+V).',
    '<textarea readonly rows="14" style="width:100%;font:inherit;font-size:14.5px;padding:12px;border:1px solid var(--vien);border-radius:9px;background:var(--nen);color:var(--chu)">'+esc(txt)+'</textarea>'+
    '<p style="margin:14px 0 0"><a class="nut" target="_blank" rel="noopener" href="https://t.me/share/url?url='+
    encodeURIComponent(' ')+'&text='+encodeURIComponent(txt)+'">Mở Telegram</a></p>');
}

            return [k, 'Tháng '+k.slice(5,7)+'/'+k.slice(0,4)]; })),tcLoc.tg)+

          '<div><label for="l-tu">Nội dung / Từ khóa</label>'+

          'style="width:100%;background:var(--nen);border:1px solid var(--vien);border-radius:9px;padding:11px 13px;font:inherit;font-size:15px;color:var(--chu);min-height:44px"></div>'+
          '<button class="nut-xem" type="button" id="l-tim">Tìm kiếm</button>'+

    function docLoc(){
      tcLoc.nha=document.getElementById('l-nha').value;
      tcLoc.loai=document.getElementById('l-loai').value;
      tcLoc.hm=document.getElementById('l-hm').value;
      tcLoc.tg=document.getElementById('l-tg').value;
      tcLoc.tu=document.getElementById('l-tu').value;
    }
    document.getElementById('loc-tc').addEventListener('change', function(){ docLoc(); veTab(tcTab); });
    document.getElementById('l-tim').addEventListener('click', function(){ docLoc(); veTab(tcTab); });
    document.getElementById('l-xoa').addEventListener('click', function(){
      tcLoc={nha:'',loai:'',hm:'',tg:'',tu:''};
      ['l-nha','l-loai','l-hm','l-tg'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('l-tu').value=''; veTab(tcTab);
    });

    function locGD(){
      var tu=tcLoc.tu.toLowerCase().trim();
      return gd.filter(function(g){
        if(!!g.da_xoa !== tcXoa) return false;
        if(tcLoc.nha && (!g.nha_tro || g.nha_tro.ma_nha!==tcLoc.nha)) return false;
        if(tcLoc.loai && g.loai!==tcLoc.loai) return false;
        if(tcLoc.hm && g.hang_muc!==tcLoc.hm) return false;
        if(tcLoc.tg && String(g.ngay||'').slice(0,7)!==tcLoc.tg) return false;
        if(tu && ((g.dien_giai||'')+' '+(hm[g.hang_muc]||'')).toLowerCase().indexOf(tu)<0) return false;
        return true;
      });
    }
    function locTT(){
      var tu=tcLoc.tu.toLowerCase().trim();
      return tt.filter(function(t){
        var ma=t.hoa_don&&t.hoa_don.phong&&t.hoa_don.phong.nha_tro?t.hoa_don.phong.nha_tro.ma_nha:'';
        if(tcLoc.nha && ma!==tcLoc.nha) return false;
        if(tcLoc.loai==='chi') return false;
        if(!!t.da_xoa !== tcXoa) return false;
        if(tcLoc.tg && String(t.ngay_thanh_toan||'').slice(0,7)!==tcLoc.tg) return false;
        if(tu){
          var x=(t.noi_dung||'')+' '+(t.nguoi_thu||'')+' '+(t.hoa_don&&t.hoa_don.so_hoa_don||'')+' '+(t.khach_thue&&t.khach_thue.ho_ten||'');
          if(x.toLowerCase().indexOf(tu)<0) return false;
        }
        return true;
      });
    }

    /* Công tắc xem phiếu đã xóa — chỉ Chủ trọ mới có việc gì ở đó */

        '</button>'+

          '<p class="ghi">'+(tcXoa
            ? 'Những lần thu này đã bị gỡ. Hóa đơn tương ứng đang tính là còn nợ. Khôi phục là công nợ trừ lại ngay.'
            : 'Tiền khách trả vào, đối soát với hóa đơn. '+ds2.length+' lần · tổng '+tien(s1)+' đ.')+'</p>'+
          nutDaXoa()+
          '<div class="cuon"><table><thead><tr><th>Ngày</th><th>Hóa đơn</th><th>Nhà · Phòng</th>'+
          '<th>Khách thuê</th><th>Hình thức</th><th>Người thu</th><th>Nội dung</th><th class="phai">Số tiền</th>'+
          '<th>Thao tác</th></tr></thead><tbody>'+
          (ds2.length? ds2.map(function(t){
            var h=t.hoa_don, ma=h&&h.phong&&h.phong.nha_tro?h.phong.nha_tro.ma_nha:'—';
            var mp=h&&h.phong?h.phong.ma_phong:'—';
            return '<tr'+(t.da_xoa?' class="da-xoa"':'')+'><td>'+ngay(t.ngay_thanh_toan)+'</td>'+

              '<td>'+esc(t.khach_thue?t.khach_thue.ho_ten:'—')+'</td>'+
              '<td>'+esc(t.hinh_thuc==='tien_mat'?'Tiền mặt':'Chuyển khoản')+'</td>'+
              '<td>'+esc(t.nguoi_thu||'—')+'</td>'+

                (t.da_xoa && t.ly_do_xoa ? '<br><span class="hieu-nho h-vang">Lý do xóa: '+esc(t.ly_do_xoa)+'</span>' : '')+'</td>'+

    function moTaPhieu(bang, id){
      if(bang==='thu_chi'){
        var g=gd.filter(function(x){ return x.id===id; })[0];
        return g ? (g.loai==='thu'?'Phiếu thu ':'Phiếu chi ')+tien(g.so_tien)+' đ · '+
                   ngay(g.ngay)+' · '+(hm[g.hang_muc]||g.hang_muc) : 'Phiếu này';
      }
      var t=tt.filter(function(x){ return x.id===id; })[0];
      if(!t) return 'Lần thu này';
      return 'Thu '+tien(t.so_tien)+' đ ngày '+ngay(t.ngay_thanh_toan)+
             (t.hoa_don? ' cho hóa đơn '+t.hoa_don.so_hoa_don : '');

    function lai(){ moMan('thuchi'); }

    el.addEventListener('click', function(e){
      var b=e.target.closest('[data-lam]'); if(!b) return;
      var viec=b.dataset.lam, bang=b.dataset.bang, id=b.dataset.id;

      if(viec==='them-thu' || viec==='them-chi'){
        themPhieu(viec==='them-thu'?'thu':'chi', dsHangMuc, nhas, el); return;
      }
      if(viec==='doi-xoa'){ tcXoa=!tcXoa; veTab(tcTab); return; }
      if(viec==='xuat-tc'){
        var HT={tien_mat:'Tiền mặt',chuyen_khoan:'Chuyển khoản',vi_dien_tu:'Ví điện tử',bu_tru:'Bù trừ'};
        if(tcTab==='so'){
          var a=locGD();
          xuatXlsx([['Sổ giao dịch',[['Ngày','Loại','Hạng mục','Nhà','Diễn giải','Hình thức','Số tiền','Tự động','Đã xóa','Lý do xóa']]
            .concat(a.map(function(g){ return [ngay(g.ngay), g.loai==='thu'?'Thu':'Chi', hm[g.hang_muc]||g.hang_muc,
              g.nha_tro?g.nha_tro.ma_nha:'', g.dien_giai||'', HT[g.hinh_thuc]||g.hinh_thuc||'',
              (g.loai==='thu'?1:-1)*g.so_tien, g.thanh_toan_id?'Có':'', g.da_xoa?'Có':'', g.ly_do_xoa||'']; }))]],

          banh('Đã xuất '+a.length+' phiếu ra file Excel.');
        } else {

          xuatXlsx([['Lịch sử thanh toán',[['Ngày','Hóa đơn','Nhà','Phòng','Khách thuê','Hình thức','Người thu','Mã giao dịch','Nội dung','Số tiền','Đã xóa']]
            .concat(b2.map(function(t){ var h=t.hoa_don;
              return [ngay(t.ngay_thanh_toan), h?h.so_hoa_don:'', h&&h.phong&&h.phong.nha_tro?h.phong.nha_tro.ma_nha:'',
                h&&h.phong?h.phong.ma_phong:'', t.khach_thue?t.khach_thue.ho_ten:'', HT[t.hinh_thuc]||t.hinh_thuc||'',
                t.nguoi_thu||'', t.ma_giao_dich||'', t.noi_dung||'', +t.so_tien, t.da_xoa?'Có':'']; }))]],
            'O-TRO-lich-su-thanh-toan-'+homNayVN()+'.xlsx');
          banh('Đã xuất '+b2.length+' lần thanh toán ra file Excel.');
        }
        return;
      }
      if(viec==='nk'){   xemNhatKy(id, moTaPhieu(bang,id)); return; }
      if(viec==='xoa'){  xoaPhieu(bang, id, moTaPhieu(bang,id), lai); return; }
      if(viec==='phuc'){ khoiPhucPhieu(bang, id, moTaPhieu(bang,id), lai); return; }
      if(viec==='sua'){
        if(bang==='thu_chi'){
          var g=gd.filter(function(x){ return x.id===id; })[0];
          if(g) suaPhieu(g, dsHangMuc, nhas, lai);
        } else {
          var t=tt.filter(function(x){ return x.id===id; })[0];
          if(t) suaThanhToan(t, lai);
        }
      }
    });

    veTab(tcTab); noiTab(veTab);
  }).catch(function(e){ el.innerHTML=daiHeader('Thu chi','')+baoLoi(e); });
}

/* ---------- Thêm một phiếu thu hoặc phiếu chi ---------- */
function themPhieu(loai, dsHangMuc, nhas, el){
  var muc = chonHangMuc(dsHangMuc, loai, null);
  if(!muc.length){ banh('Chưa khai hạng mục '+(loai==='thu'?'thu':'chi')+' nào.'); return; }

  var o = [
    {id:'ngay', nhan:'Ngày', kieu:'ngay', gt:homNayVN(), batBuoc:true},
    {id:'hang_muc', nhan:'Hạng mục', kieu:'chon', chon:muc, batBuoc:true},
    {id:'nha_tro_id', nhan:'Thuộc nhà trọ', kieu:'chon',
     chon:[['','Không gắn nhà nào — chi chung']].concat(nhas.map(function(n){ return [n.id, n.ma_nha]; }))},
    {id:'hinh_thuc', nhan:'Hình thức', kieu:'chon',
     chon:[['tien_mat','Tiền mặt'],['chuyen_khoan','Chuyển khoản']], gt:'tien_mat'},
    {id:'so_tien', nhan:'Số tiền (đồng)', kieu:'so', batBuoc:true, goiY:'Ví dụ 850000'},
    {id:'dien_giai', nhan:'Diễn giải', kieu:'dai', rong:true,
     goiY:'Viết cho người ba tháng sau đọc vẫn hiểu. Ví dụ: sửa máy bơm tầng trệt K11'}
  ];

  moHop({
    ten: loai==='thu' ? 'Thêm phiếu thu' : 'Thêm phiếu chi',
    mo: loai==='thu' ? 'Tiền vào sổ quỹ. Tiền khách trả hóa đơn thì hệ thống tự ghi, không cần lập phiếu ở đây.'
                     : 'Tiền ra khỏi sổ quỹ: thuê sỉ, sửa chữa, mua sắm, phí dịch vụ.',
    o: o,
    nutLuu: 'Lưu phiếu',
    xong: loai==='thu' ? 'Đã ghi phiếu thu vào sổ quỹ.' : 'Đã ghi phiếu chi vào sổ quỹ.',
    kiem: function(g){
      if(!g.so_tien || g.so_tien<=0) return 'Số tiền phải lớn hơn 0.';
      if(g.so_tien > 900000000) return 'Số tiền lớn bất thường. Kiểm tra lại có thừa số 0 không.';
      if(!g.ngay) return 'Chưa chọn ngày.';
      if(g.ngay > homNayVN()) return 'Ngày nằm ở tương lai. Sổ quỹ chỉ ghi việc đã xảy ra.';
      return null;
    },
    luu: function(g){
      return toChuc().then(function(tc){
        return ghi('thu_chi', 'POST', [{
          to_chuc_id: tc, ngay: g.ngay, loai: loai, hang_muc: g.hang_muc,
          nha_tro_id: g.nha_tro_id || null, so_tien: g.so_tien,
          hinh_thuc: g.hinh_thuc || 'tien_mat', dien_giai: g.dien_giai || null
        }]);
      });
    },
    xongThi: function(){ moMan('thuchi'); }
  });
}

/* ---------- Vẽ biểu đồ ---------- */
var NS='http://www.w3.org/2000/svg';
var MAU=['#2563EB','#E8590C','#059669','#CA8A04','#DB2777','#7C3AED','#0891B2'];
function sel(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
function bien(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function veDonut(id, dl, nhanGiua, soGiua){
  var s=document.getElementById(id); if(!s) return; s.textContent='';
  var cx=100, cy=100, R=78, r=50;
  var tong=dl.reduce(function(a,d){return a+d.v;},0);
  if(!tong){ var t0=sel('text',{x:cx,y:cy,'text-anchor':'middle','font-size':13,fill:bien('--chu-mo')});
    t0.textContent='Chưa có số'; s.appendChild(t0); return; }
  var coSo = dl.filter(function(d){ return d.v>0; });
  if(coSo.length===1){
    s.appendChild(sel('circle',{cx:cx, cy:cy, r:(R+r)/2, fill:'none',
      stroke:coSo[0].m, 'stroke-width':R-r}));
  }
  var goc=-Math.PI/2;
  if(coSo.length>1) dl.forEach(function(d){
    var phan=(d.v/tong)*Math.PI*2; if(phan<=0) return;
    var g2=goc+phan-(dl.length>1?0.02:0), lon=phan>Math.PI?1:0;
    s.appendChild(sel('path',{fill:d.m, d:
      'M'+(cx+R*Math.cos(goc))+' '+(cy+R*Math.sin(goc))+
      'A'+R+' '+R+' 0 '+lon+' 1 '+(cx+R*Math.cos(g2))+' '+(cy+R*Math.sin(g2))+
      'L'+(cx+r*Math.cos(g2))+' '+(cy+r*Math.sin(g2))+
      'A'+r+' '+r+' 0 '+lon+' 0 '+(cx+r*Math.cos(goc))+' '+(cy+r*Math.sin(goc))+'Z'}));
    goc+=phan;
  });
  var t1=sel('text',{x:cx,y:cy-4,'text-anchor':'middle','font-size':11,fill:bien('--chu-phu')});
  t1.textContent=nhanGiua; s.appendChild(t1);
  var t2=sel('text',{x:cx,y:cy+15,'text-anchor':'middle','font-size':15,'font-weight':700,fill:bien('--chu')});
  t2.textContent=soGiua; s.appendChild(t2);
}

function veDuong(id, THU, CHI, soNgay){
  var s=document.getElementById(id); if(!s) return; s.textContent='';
  var W=900,H=290,L=68,R=24,T=16,B=36, pw=W-L-R, ph=H-T-B;
  var max=Math.max.apply(null, THU.concat(CHI).concat([1]));
  max = Math.ceil(max/10000000)*10000000 || 10000000;
  var y=function(v){ return T+ph-(v/max)*ph; };
  var x=function(i){ return L+(pw/Math.max(soNgay-1,1))*i; };
  var buoc=max/4;
  for(var g=0; g<=max+1; g+=buoc){
    s.appendChild(sel('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),stroke:bien('--vien'),'stroke-width':1}));
    var tx=sel('text',{x:L-10,y:y(g)+4,'text-anchor':'end','font-size':11,fill:bien('--chu-mo')});
    tx.textContent=(g/1000000).toFixed(0)+'tr'; s.appendChild(tx);
  }
  [[THU,'#0F7B4F'],[CHI,'#C2410C']].forEach(function(bo){
    var d='', co=false;
    bo[0].forEach(function(v,i){ d+=(i?'L':'M')+x(i)+' '+y(v); if(v>0) co=true; });
    s.appendChild(sel('path',{d:d,fill:'none',stroke:bo[1],'stroke-width':2.4,

  return {hd:hd, dong:dong, tc:tc, tt:tt, no:no, gh:gh, ll:ll, ph:ph, ky:ky};

var TEN_DV={tien_phong:'Tiền phòng',dien:'Tiền điện',nuoc:'Tiền nước',internet:'Internet',
            rac:'Đổ rác',gui_xe:'Gửi xe',dich_vu_khac:'Phí dịch vụ'};

/* ===== CƠ CẤU DOANH THU / CHI PHÍ THEO CÁCH VẬN HÀNH (đợt 2, chốt 01/10/2026) =====
   Doanh thu: theo hóa đơn ĐÃ PHÁT HÀNH của kỳ + phiếu thu gõ tay.
   Cọc chủ nhà và cọc khách KHÔNG nằm trong lợi nhuận. */
var DT_MUC = [
  ['kt','1. Khách thuê'], ['dien','2. Điện'], ['nuoc','3. Nước'], ['internet','4. Internet'],
  ['rac','5. Đổ rác'], ['dv','6. Dịch vụ'], ['khac','7. Thu khác / Điều chỉnh']
];
var CP_MUC = [
  ['coc_chu_nha','1. Cọc'], ['cai_tao','2. Cải tạo'], ['thue_nha','3. Tiền thuê'], ['hoa_hong','4. Hoa hồng'],
  ['chi_dien','5. Điện'], ['chi_nuoc','6. Nước'], ['internet','7. Internet'], ['chi_do_rac','8. Đổ rác'],
  ['chi_dich_vu_khac','9. Dịch vụ khác'], ['khac','10. CP khác / Điều chỉnh'], ['quan_ly','11. CP Quản lý'],
  ['ve_sinh','12. CP dọn VS'], ['cong_an','13. CP an ninh']
];
/* dòng hóa đơn → mục doanh thu */
var DT_DONG = {dien:'dien', nuoc:'nuoc', internet:'internet', rac:'rac', gui_xe:'dv', dich_vu_khac:'dv'};
/* phiếu thu gõ tay → mục doanh thu (tien_coc, thu_hoa_don: không phải doanh thu) */
var DT_PHIEU = {tien_phong:'kt', thu_dien:'dien', thu_nuoc:'nuoc', thu_internet:'internet',
                thu_do_rac:'rac', tien_dich_vu:'dv', bai_xe:'dv', thu_khac:'khac'};
/* mã chi cũ → mục mới (phòng khi còn sót phiếu cũ) */
var CP_CU = {sua_chua:'cai_tao', bao_tri:'khac', van_hanh:'quan_ly', dien_nuoc_goc:'chi_dien'};

/* ---------- Gom doanh thu / chi phí theo TỪNG CĂN ----------
   hd: hóa đơn ĐÃ PHÁT HÀNH (có phong.nha_tro.ma_nha), dong: dòng hóa đơn,
   tc: phiếu trong sổ (có nha_tro.ma_nha), cùng một khoảng thời gian.
   Cọc chủ nhà và Cải tạo KHÔNG trừ vào lợi nhuận (chốt 01/10/2026). */
var NGOAI_LN = {coc_chu_nha:1, cai_tao:1};
function maNhaCua(x){ return x && x.phong && x.phong.nha_tro ? x.phong.nha_tro.ma_nha : null; }
function gomCan(hd, dong, tc){
  var C={};
  function o(m){ m=m||'_chung';
    if(!C[m]){ C[m]={DT:{}, CP:{}, thucThu:0, cocKhachThu:0};
      DT_MUC.forEach(function(x){ C[m].DT[x[0]]=0; }); CP_MUC.forEach(function(x){ C[m].CP[x[0]]=0; }); }
    return C[m]; }
  var maHD={}, congDong={};
  hd.forEach(function(h){ maHD[h.id]=maNhaCua(h); o(maNhaCua(h)); });
  dong.forEach(function(x){ if(!(x.hoa_don_id in maHD)) return;
    o(maHD[x.hoa_don_id]).DT[ DT_DONG[x.loai_dich_vu] || 'kt' ] += +x.thanh_tien;
    congDong[x.hoa_don_id]=(congDong[x.hoa_don_id]||0) + +x.thanh_tien; });
  /* Mục 7: phần chênh giữa tổng hóa đơn (bỏ nợ kỳ trước) và cộng các dòng
     = giảm giá / khấu trừ (âm) + tiền lẻ làm tròn → tổng luôn khớp hóa đơn */
  hd.forEach(function(h){ o(maNhaCua(h)).DT.khac += (+h.tong_tien - +(h.no_ky_truoc||0)) - (congDong[h.id]||0); });
  tc.forEach(function(g){
    var c=o(g.nha_tro ? g.nha_tro.ma_nha : null);
    if(g.loai==='thu'){
      if(g.thanh_toan_id || g.hang_muc==='thu_hoa_don'){ c.thucThu += +g.so_tien; return; }
      if(g.hang_muc==='tien_coc'){ c.cocKhachThu += +g.so_tien; return; }
      c.DT[ DT_PHIEU[g.hang_muc] || 'khac' ] += +g.so_tien; c.thucThu += +g.so_tien;
    } else {
      var m = CP_CU[g.hang_muc] || g.hang_muc;
      if(c.CP[m]===undefined) m='khac';
      c.CP[m] += +g.so_tien;
    }
  });
  Object.keys(C).forEach(function(m){
    var c=C[m]; c.tongDT=0; c.tongCP=0;
    DT_MUC.forEach(function(x){ c.tongDT+=c.DT[x[0]]; });
    CP_MUC.forEach(function(x){ if(!NGOAI_LN[x[0]]) c.tongCP+=c.CP[x[0]]; });
    c.loiNhuan=c.tongDT-c.tongCP;
  });
  return C;
}
function congCot(ds){                      /* cộng nhiều cột thành một */
  var t={DT:{}, CP:{}, thucThu:0, cocKhachThu:0, tongDT:0, tongCP:0, loiNhuan:0};
  DT_MUC.forEach(function(x){ t.DT[x[0]]=0; }); CP_MUC.forEach(function(x){ t.CP[x[0]]=0; });
  ds.forEach(function(c){ if(!c) return;
    DT_MUC.forEach(function(x){ t.DT[x[0]]+=c.DT[x[0]]; }); CP_MUC.forEach(function(x){ t.CP[x[0]]+=c.CP[x[0]]; });
    ['thucThu','cocKhachThu','tongDT','tongCP','loiNhuan'].forEach(function(k){ t[k]+=c[k]; }); });
  return t;
}
/* Lấp đầy hiện tại + doanh thu tiền phòng khi kín 100% (giá niêm yết các phòng) */
function phongCua(ph, ma){
  var ds=ph.filter(function(p){ return !ma || p.ma_nha===ma; });
  var thue=ds.filter(function(p){ return p.trang_thai==='dang_thue'; }).length;
  return {tong:ds.length, thue:thue, kin:ds.reduce(function(a,p){ return a + +(p.gia_thue||0); },0)};
}
function thangCuoi(k){ var y=+k.slice(0,4), m=+k.slice(5,7); return k.slice(0,8)+('0'+new Date(y,m,0).getDate()).slice(-2); }
function soThang(tu, den){ return (+den.slice(0,4)-+tu.slice(0,4))*12 + (+den.slice(5,7)-+tu.slice(5,7)) + 1; }
/* Hoàn vốn theo lợi nhuận THỰC TẾ của toàn bộ thời gian vận hành của căn
   (từ tháng đầu tiên căn có hóa đơn trong hệ thống tới tháng đang xem). */
function hoanVonCan(ma, von, hdAll, dongAll, tcAll, denKy){
  var hd=hdAll.filter(function(h){ return maNhaCua(h)===ma && String(h.ky).slice(0,7)<=denKy.slice(0,7); });
  if(!hd.length) return null;
  var tu=hd.map(function(h){ return String(h.ky).slice(0,7); }).sort()[0];
  var cuoi=thangCuoi(denKy.slice(0,7)+'-01');
  var tc=tcAll.filter(function(g){ return g.nha_tro && g.nha_tro.ma_nha===ma && String(g.ngay).slice(0,10)<=cuoi; });
  var c=gomCan(hd, dongAll, tc)[ma] || congCot([]);
  var n=soThang(tu, denKy), tb=c.loiNhuan/n;
  return {tu:tu, n:n, luyKe:c.loiNhuan, tb:tb, von:von,
          hoanVon: tb>0 && von>0 ? von/tb : null,
          daThuHoi: von>0 ? c.loiNhuan*100/von : null,
          conLai: tb>0 && von>0 ? Math.max(0,(von-c.loiNhuan)/tb) : null};
}

/* ===== THẺ "DOANH THU – CHI PHÍ & LÃI LỖ TỪNG CĂN" (gộp hai thẻ cũ) ===== */
function kyDangXem(){
  if(bcNam && bcThang) return bcNam+'-'+bcThang;
  var m=''; BC.hd.forEach(function(h){ var k=String(h.ky).slice(0,7); if(k>m) m=k; });
  return m || homNayVN().slice(0,7);
}
function duLieuCan(d){
  var C=gomCan(d.hd, d.dong, d.tc);
  var cans=BC.nha.filter(function(m){ return !bcNha || m===bcNha; });
  var cot=cans.map(function(m){ return {ten:m, ma:m, c:C[m]||congCot([]), p:phongCua(BC.ph,m)}; });
  if(!bcNha && C._chung) cot.push({ten:'Chi phí chung', ma:'_chung', c:C._chung, chung:true});
  var tong={ten:'Tổng', ma:'_tong', c:congCot(cot.map(function(x){ return x.c; })), p:phongCua(BC.ph, bcNha||null), tong:true};
  return {cot:cot, tong:tong, ky:kyDangXem()};
}
function tabDTCP(d){
  var D=duLieuCan(d), cot=D.cot.concat([D.tong]), T=D.tong.c;
  function so(v,am){ return '<td class="phai '+(am&&v<0?'am':'')+'">'+(v<0?'−':'')+tien(Math.abs(Math.round(v)))+'</td>'; }
  function hang(nhan, f, kieu){
    return '<tr'+(kieu?' class="'+kieu+'"':'')+'><td class="ten">'+nhan+'</td>'+cot.map(function(x){ return f(x); }).join('')+'</tr>'; }
  function nhom(t){ return '<tr class="nhom-nha"><td colspan="'+(cot.length+1)+'">'+t+'</td></tr>'; }
  var bien=function(x){ var c=x.c; return '<td class="phai">'+(c.tongDT? pt(Math.round(c.loiNhuan*1000/c.tongDT)/10) : '—')+'</td>'; };
  var lap=function(x){ return '<td class="phai">'+(x.p && x.p.tong ? pt(Math.round(x.p.thue*1000/x.p.tong)/10) : '—')+'</td>'; };
  var hv=function(x){
    if(!x.p || !x.p.kin) return '<td class="phai">—</td>';
    var n=Math.round(x.c.tongCP*1000/x.p.kin)/10, l=x.p.tong? x.p.thue*100/x.p.tong : 0;
    return '<td class="phai'+(n>l?' am':'')+'">'+pt(n)+'</td>'; };

  var html =
  '<p class="nhac-tab">Số thật của <b>'+(bcThang?'tháng '+(+bcThang)+'/'+bcNam:'toàn bộ thời gian')+'</b>. '+
  'Doanh thu theo <b>hóa đơn đã phát hành</b>, chi phí theo <b>phiếu chi</b> gắn với từng căn. '+
  '<b>Cọc chủ nhà</b> và <b>Cải tạo</b> hiện riêng, không trừ vào lợi nhuận.</p>'+
  '<div class="bc-the">'+
    T1('Doanh thu', tien(T.tongDT)+' đ','thu','Theo hóa đơn đã phát hành')+
    T1('Chi phí', tien(T.tongCP)+' đ','chi','Không tính cọc và cải tạo')+
    T1('Lợi nhuận', (T.loiNhuan<0?'−':'')+tien(Math.abs(T.loiNhuan))+' đ', T.loiNhuan>=0?'loi':'chi',
       T.tongDT? 'Biên lợi nhuận '+pt(Math.round(T.loiNhuan*1000/T.tongDT)/10) : '')+
    T1('Tiền thực đã thu', tien(T.thucThu)+' đ','','Để đối chiếu với doanh thu')+

/* ---------- TẠO FILE EXCEL .xlsx THẬT ----------
   Trước đây xuất file XML đội tên .xls — Excel mở ra báo "định dạng
   và đuôi file không khớp", nhiều máy chặn luôn. Giờ tự đóng gói đúng
   chuẩn .xlsx (Office Open XML), không cần thư viện ngoài, mở được
   bằng Excel, Google Sheets, WPS, LibreOffice.
   sheets = [[tên sheet, [[ô,ô,...], ...]], ...] — dòng đầu là tiêu đề. */
var CRC_BANG = (function(){
  var t=[], c, n, k;
  for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(b){
  var c=0xFFFFFFFF;
  for(var i=0;i<b.length;i++) c = CRC_BANG[(c ^ b[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function dongZip(tep){                 /* tep = [{ten, noi: Uint8Array}] — nén kiểu "store" */
  var enc=new TextEncoder(), phan=[], tt=[], lech=0;
  function u16(v){ return [v&255,(v>>>8)&255]; }
  function u32(v){ return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]; }
  var d=new Date(), gio=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),
      ngy=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  tep.forEach(function(f){
    var ten=enc.encode(f.ten), crc=crc32(f.noi), n=f.noi.length;
    var dau=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(gio),u16(ngy),
                      u32(crc),u32(n),u32(n),u16(ten.length),u16(0));
    phan.push(new Uint8Array(dau), ten, f.noi);
    tt.push({ten:ten, crc:crc, n:n, lech:lech});
    lech += dau.length + ten.length + n;
  });
  var batDau=lech, co=0;
  tt.forEach(function(x){
    var dau=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(gio),u16(ngy),
                      u32(x.crc),u32(x.n),u32(x.n),u16(x.ten.length),u16(0),u16(0),u16(0),u16(0),
                      u32(0),u32(x.lech));
    phan.push(new Uint8Array(dau), x.ten); co += dau.length + x.ten.length;
  });
  phan.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(tt.length),u16(tt.length),
                                     u32(co),u32(batDau),u16(0))));
  return new Blob(phan, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function taiVe(blob, ten){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=ten;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function xuatXlsx(sheets, tenFile){
  var enc=new TextEncoder();
  function x(v){ return String(v==null?'':v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')
    .replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function cot(i){ var s=''; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
  var daDung={};
  var ds = sheets.map(function(sh, i){
    var ten=String(sh[0]||('Sheet'+(i+1))).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31) || ('Sheet'+(i+1));
    while(daDung[ten]) ten=ten.slice(0,28)+' '+(i+1);
    daDung[ten]=1;
    var hang=sh[1]||[], rong=[];
    hang.forEach(function(r){ r.forEach(function(c,j){
      var l=String(c==null?'':(typeof c==='number'?c.toLocaleString('vi-VN'):c)).length;
      rong[j]=Math.min(60, Math.max(rong[j]||8, l+2)); }); });
    var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
      (rong.length?'<cols>'+rong.map(function(w,j){ return '<col min="'+(j+1)+'" max="'+(j+1)+'" width="'+w+'" customWidth="1"/>'; }).join('')+'</cols>':'')+
      '<sheetData>'+hang.map(function(r,ri){
        return '<row r="'+(ri+1)+'">'+r.map(function(c,j){
          var ref=cot(j)+(ri+1);
          if(typeof c==='number' && isFinite(c) && ri>0)
            return '<c r="'+ref+'" s="2"><v>'+c+'</v></c>';
          if(c==null || c==='') return '';
          return '<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+x(c)+'</t></is></c>';
        }).join('')+'</row>';
      }).join('')+'</sheetData></worksheet>';
    return {ten:ten, xml:xml};
  });
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    ds.map(function(s,i){ return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('')+
    '</Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    ds.map(function(s,i){ return '<sheet name="'+x(s.ten)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; }).join('')+
    '</sheets></workbook>';
  var wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    ds.map(function(s,i){ return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join('')+
    '<Relationship Id="rId'+(ds.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';
  var st='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
    '<fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
    '<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';
  var tep=[{ten:'[Content_Types].xml', noi:enc.encode(ct)},
           {ten:'_rels/.rels', noi:enc.encode(rels)},
           {ten:'xl/workbook.xml', noi:enc.encode(wb)},
           {ten:'xl/_rels/workbook.xml.rels', noi:enc.encode(wbr)},
           {ten:'xl/styles.xml', noi:enc.encode(st)}];
  ds.forEach(function(s,i){ tep.push({ten:'xl/worksheets/sheet'+(i+1)+'.xml', noi:enc.encode(s.xml)}); });
  taiVe(dongZip(tep), tenFile.replace(/[\\\/:*?"<>|]/g,'-'));
}

/* ---------- XUẤT EXCEL BÁO CÁO ---------- */
function xuatExcel(d){
  var muc={}; d.dong.forEach(function(x){ var k=x.loai_dich_vu||'tien_phong'; muc[k]=(muc[k]||0)+ +x.thanh_tien; });
  var sheets=[];
  sheets.push(['Tổng hợp',
    [['Hạng mục','Số tiền']].concat(Object.keys(muc).map(function(k){ return [TEN_DV[k]||k, muc[k]]; }))]);
  sheets.push(sheetDTCP(d));
  sheets.push(['Công nợ',
    [['Hóa đơn','Nhà','Phòng','Khách thuê','Điện thoại','Hạn','Tổng tiền','Đã thu','Còn nợ','Số ngày quá hạn']]
      .concat(d.no.map(function(n){ return [n.so_hoa_don,n.ma_nha,n.ma_phong,n.khach_thue,n.sdt||'',
        ngay(n.han_thanh_toan),+n.tong_tien,+n.da_thanh_toan,+n.con_no,n.so_ngay_qua_han]; }))]);
  sheets.push(['Thu chi',
    [['Ngày','Loại','Hạng mục','Nhà','Diễn giải','Hình thức','Số tiền']]
      .concat(d.tc.map(function(g){ return [ngay(g.ngay), g.loai==='thu'?'Thu':'Chi',
        BC.hm[g.hang_muc]||g.hang_muc, g.nha_tro?g.nha_tro.ma_nha:'', g.dien_giai||'',
        g.hinh_thuc==='tien_mat'?'Tiền mặt':'Chuyển khoản', +g.so_tien]; }))]);
  var shv=sheetHoanVon(); if(shv) sheets.push(shv);

  xuatXlsx(sheets, 'O-TRO-bao-cao'+(bcNha?'-'+bcNha:'')+(bcThang?'-'+bcThang+'-'+bcNam:'')+'.xlsx');
  banh('Đã xuất file Excel báo cáo.');
}

function inPhieuThu(ds, NH){

  function mot(x){

    var ma=maNhaHD(h), mp=maPhongHD(h);
    var nha = h.phong && h.phong.nha_tro ? h.phong.nha_tro : {};
    var kh = h.hop_dong && h.hop_dong.khach_thue ? h.hop_dong.khach_thue : {};

    (NH && NH.so_tai_khoan ? '<p class="ck">Chuyển khoản: <b>'+esc(NH.ngan_hang||'')+' · '+esc(NH.so_tai_khoan)+
      (NH.chu_tai_khoan?' · '+esc(NH.chu_tai_khoan):'')+'</b> · nội dung: <b>'+esc(h.so_hoa_don)+'</b></p>' : '')+

  }

/* ---------- Ghi nhận khách trả tiền ----------
   Lưu xong, kho dữ liệu TỰ làm hết phần còn lại: tính lại công nợ hóa đơn,
   thêm dòng vào Lịch sử thanh toán, sinh phiếu thu trong Sổ giao dịch. */
var NGUOI_THU = ['La Vĩnh Tiến', 'Nguyễn Anh Hiệp'];
function ghiThanhToan(h, xongThi){
  if(h.trang_thai==='nhap'){ banh('Hóa đơn này còn là bản nháp. Bấm Phát hành trước rồi mới thu tiền.'); return; }
  if(h.trang_thai==='da_huy'){ banh('Hóa đơn này đã hủy. Thu tiền vào hóa đơn mới lập lại.'); return; }
  var conNo = Number(h.con_no)||0;
  if(conNo<=0){ banh('Hóa đơn này đã thu đủ, không còn gì để ghi.'); return; }
  var ma=maNhaHD(h), mp=maPhongHD(h), kh=tenKhachHD(h);
  var toi = TOI && NGUOI_THU.indexOf(TOI.ho_ten)>=0 ? TOI.ho_ten : '';

  var o = [
    {id:'ngay', nhan:'Ngày nhận tiền', kieu:'ngay', gt:homNayVN(), batBuoc:true},
    {id:'hinh_thuc', nhan:'Hình thức', kieu:'chon',
     chon:[['chuyen_khoan','Chuyển khoản'],['tien_mat','Tiền mặt']], gt:'chuyen_khoan'},
    {id:'so_tien', nhan:'Số tiền khách trả (đồng)', kieu:'so', gt:conNo, batBuoc:true,
     goi:'Còn nợ '+tien(conNo)+' đ. Trả một phần cũng ghi được.'},
    {id:'nguoi_thu', nhan:'Người thu tiền', kieu:'chon', gt:toi, batBuoc:true,
     chon:[['','— Chọn người thu —']].concat(NGUOI_THU.map(function(x){ return [x,x]; })).concat([['_khac','Nhập tên vào…']])},
    {id:'nguoi_thu_khac', nhan:'Tên người thu', goiY:'Gõ họ tên người thu tiền'},
    {id:'ma_giao_dich', nhan:'Mã giao dịch trên sao kê', goiY:'Để trống nếu thu tiền mặt'},
    {id:'noi_dung', nhan:'Ghi chú', kieu:'dai', rong:true, goiY:'Không bắt buộc. Ví dụ: khách hẹn trả nốt ngày 10'}
  ];

  moHop({
    ten:'Ghi nhận thanh toán',
    mo: h.so_hoa_don+' · '+ma+' '+mp+(kh&&kh!=='—'?' · '+kh:'')+' · còn nợ '+tien(conNo)+' đ. '+
        'Lưu xong hệ thống tự ghi phiếu thu vào Sổ giao dịch — không cần lập phiếu tay.',
    o:o, nutLuu:'Xác nhận đã thu', xong:'Đã ghi. Hóa đơn, Lịch sử thanh toán và Sổ giao dịch đã tự cập nhật.',
    moXong:function(che){
      var chon=che.querySelector('#f-nguoi_thu'), khac=che.querySelector('#f-nguoi_thu_khac').closest('.o-form2');
      function doi(){ khac.style.display = chon.value==='_khac' ? '' : 'none'; }
      chon.addEventListener('change', doi); doi();
    },
    kiem:function(g){
      if(!g.so_tien || g.so_tien<=0) return 'Số tiền phải lớn hơn 0.';
      if(!g.nguoi_thu) return 'Chọn người thu tiền.';
      if(g.nguoi_thu==='_khac' && (!g.nguoi_thu_khac || g.nguoi_thu_khac.trim().length<2)) return 'Gõ tên người thu tiền.';
      if(g.ngay > homNayVN()) return 'Ngày nằm ở tương lai. Chỉ ghi tiền đã thật sự nhận.';
      if(g.so_tien > conNo && !hoiLai('Khách trả '+tien(g.so_tien)+' đ, nhiều hơn số còn nợ '+
          tien(conNo)+' đ.\n\nGhi dư như vậy?')) return 'Đã dừng, chưa ghi gì.';
      return null;
    },
    luu:function(g){
      return toChuc().then(function(tc){
        return ghi('thanh_toan','POST',[{
          to_chuc_id:tc, hoa_don_id:h.id,
          khach_thue_id: h.hop_dong && h.hop_dong.khach_thue_id ? h.hop_dong.khach_thue_id : null,
          ngay_thanh_toan:g.ngay, so_tien:g.so_tien,
          hinh_thuc:g.hinh_thuc||'chuyen_khoan',
          nguoi_thu: g.nguoi_thu==='_khac' ? g.nguoi_thu_khac.trim() : g.nguoi_thu,
          nguoi_ghi_id: TOI ? TOI.id : null,
          ma_giao_dich:g.ma_giao_dich||null, noi_dung:g.noi_dung||null
        }]);
      });
    },
    xongThi: xongThi
  });
}

/* ==================== CHỈ SỐ ĐIỆN NƯỚC ====================
   Màn này trước đây không có. Cách duy nhất nhập chỉ số là gõ lệnh
   cho bot Telegram — người vận hành mở web tìm không ra, và không có
   chỉ số thì không lập được hóa đơn. Đây là chỗ bịt lỗ đó.
   Số gõ tay vào thẳng trạng thái đã duyệt: người gõ đã nhìn thấy
   đồng hồ. Số Trợ Lý AI đọc từ ảnh vẫn phải bấm duyệt. */
var csKy='', csNha='';

function manChiSo(el){
  if(!csKy) csKy = kyHienTai();
  el.innerHTML = daiHeader('Chỉ số điện nước','Đang tải…','Vận hành')+dangTai();

  var kyTruoc = kyLui(csKy);
  Promise.all([
    lay('v_phong?select=id,ma_nha,ma_phong,khach_thue,loai,trang_thai&order=ma_nha,ma_phong'),
    lay('chi_so?select=*&ky=eq.'+csKy),
    lay('chi_so?select=phong_id,loai_dich_vu,chi_so_moi&ky=eq.'+kyTruoc+'&trang_thai_duyet=eq.da_duyet'),
    lay('hop_dong?select=phong_id,cach_tinh_nuoc&trang_thai=in.(hieu_luc,sap_het_han)'),
    lay('nha_tro?select=id,ma_nha&order=ma_nha')
  ]).then(function(k){
    var ps=k[0], nay=k[1], truoc=k[2], hds=k[3], nhas=k[4];

    var cuaNay={}, cuaTruoc={}, nuocTheoChiSo={};
    nay.forEach(function(c){ cuaNay[c.phong_id+'|'+c.loai_dich_vu]=c; });
    truoc.forEach(function(c){ cuaTruoc[c.phong_id+'|'+c.loai_dich_vu]=c.chi_so_moi; });
    hds.forEach(function(h){ nuocTheoChiSo[h.phong_id] = (h.cach_tinh_nuoc||'theo_chi_so')==='theo_chi_so'; });

    var loc = ps.filter(function(p){ return !csNha || p.ma_nha===csNha; });
    var thieuDien = loc.filter(function(p){
      var c=cuaNay[p.id+'|dien']; return !c || c.trang_thai_duyet!=='da_duyet'; }).length;
    var choDuyet = nay.filter(function(c){ return c.trang_thai_duyet==='cho_duyet'; }).length;

    demMenu.chiso = thieuDien; veMenu('chiso');

    el.innerHTML = daiHeader('Chỉ số điện nước',
      'Gõ số trên đồng hồ vào đây. Có chỉ số điện đã duyệt thì mới lập được hóa đơn của kỳ.',
      'Vận hành')+
      '<div class="khoi-loc" id="loc-cs" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
        '<div><label for="cs-ky">Kỳ ghi chỉ số</label><select id="cs-ky">'+
          dsKy().map(function(x){ return '<option value="'+x[0]+'"'+(x[0]===csKy?' selected':'')+'>'+esc(x[1])+'</option>'; }).join('')+
        '</select></div>'+
        '<div><label for="cs-nha">Nhà trọ</label><select id="cs-nha">'+
          [['','Tất cả các nhà']].concat(nhas.map(function(n){ return [n.ma_nha,n.ma_nha]; }))
            .map(function(x){ return '<option value="'+esc(x[0])+'"'+(x[0]===csNha?' selected':'')+'>'+esc(x[1])+'</option>'; }).join('')+
        '</select></div>'+
      '</div>'+
      '<div class="ds" id="noi-cs"></div>';

    document.getElementById('so-nhanh').innerHTML =
      '<div class="sn"><b>'+loc.length+'</b><span>Phòng trong danh sách</span></div>'+
      '<div class="sn '+(thieuDien?'xau':'tot')+'"><b>'+thieuDien+'</b><span>Phòng chưa có chỉ số điện</span></div>'+
      '<div class="sn '+(choDuyet?'xau':'')+'"><b>'+choDuyet+'</b><span>Trợ Lý AI chờ duyệt</span></div>';

    document.getElementById('loc-cs').addEventListener('change', function(){
      csKy=document.getElementById('cs-ky').value;
      csNha=document.getElementById('cs-nha').value;
      moMan('chiso');
    });

    function oNhapSo(pid, loai, gt, tat){
      return '<input class="o-so" type="number" inputmode="numeric" step="1" min="0"'+
        ' data-p="'+esc(pid)+'" data-l="'+loai+'"'+
        (tat?' disabled title="Hợp đồng phòng này không tính nước theo chỉ số"':'')+
        ' value="'+(gt==null?'':gt)+'">';
    }
    function cuCua(pid, loai){
      var c = cuaNay[pid+'|'+loai];
      if(c && c.chi_so_cu!=null) return Number(c.chi_so_cu);
      var t = cuaTruoc[pid+'|'+loai];
      return t==null ? null : Number(t);
    }
    function moiCua(pid, loai){
      var c = cuaNay[pid+'|'+loai];
      return c && c.chi_so_moi!=null ? Number(c.chi_so_moi) : null;
    }
    function nhanTT(c){
      if(!c) return '<span class="hieu-nho h-vang">Chưa có</span>';
      if(c.trang_thai_duyet==='da_duyet')
        return '<span class="hieu-nho h-luc">Đã duyệt</span>'+
               (c.nguon==='tro_ly_ai'?' <span class="nha-pc">AI đọc</span>':'');
      if(c.trang_thai_duyet==='cho_duyet')
        return '<span class="hieu-nho h-vang">Chờ duyệt</span>'+
               '<span class="cap-nut" style="margin-left:8px">'+
               '<button class="nut-tt" type="button" data-duyet="'+esc(c.id)+'">Duyệt</button>'+
               '<button class="nut-tt xoa" type="button" data-bo="'+esc(c.id)+'">Bỏ</button></span>';
      return '<span class="hieu-nho">Đã bỏ</span>';
    }

    document.getElementById('noi-cs').innerHTML =
      '<div class="the khoi"><h2>Kỳ '+esc(nhanKy(csKy))+(csNha?' · căn '+esc(csNha):'')+'</h2>'+
      '<p class="ghi">Ô <b>kỳ trước</b> hệ thống tự điền từ số đã duyệt của kỳ liền trước. '+
      'Chỉ cần gõ cột <b>kỳ này</b>. Gõ xong bấm Lưu tất cả — số gõ tay vào thẳng, không phải chờ duyệt.</p>'+
      '<div class="cuon"><table><thead><tr>'+
        '<th>Phòng</th><th>Khách thuê</th>'+
        '<th class="phai">Điện kỳ trước</th><th class="phai">Điện kỳ này</th><th class="phai">Dùng</th>'+
        '<th class="phai">Nước kỳ trước</th><th class="phai">Nước kỳ này</th><th class="phai">Dùng</th>'+
        '<th>Trạng thái điện</th>'+
      '</tr></thead><tbody>'+
      (loc.length ? loc.map(function(p){
        var cD=cuaNay[p.id+'|dien'], cN=cuaNay[p.id+'|nuoc'];
        var dCu=cuCua(p.id,'dien'), dMoi=moiCua(p.id,'dien');
        var nCu=cuCua(p.id,'nuoc'), nMoi=moiCua(p.id,'nuoc');
        var coNuoc = nuocTheoChiSo[p.id] !== false;
        var dDung = (dCu!=null && dMoi!=null) ? dMoi-dCu : null;
        var nDung = (nCu!=null && nMoi!=null) ? nMoi-nCu : null;
        return '<tr'+(cD && cD.trang_thai_duyet==='cho_duyet'?' class="cho-duyet"':'')+'>'+
          '<td class="ten"><b>'+esc(p.ma_nha)+'</b> · '+esc(p.ma_phong)+'</td>'+
          '<td>'+esc(p.khach_thue||'—')+'</td>'+
          '<td class="phai">'+oNhapSo(p.id,'dien_cu',dCu)+'</td>'+
          '<td class="phai">'+oNhapSo(p.id,'dien',dMoi)+'</td>'+
          '<td class="phai dung'+(dDung!=null&&dDung<0?' am':'')+'" data-dung="'+esc(p.id)+'|dien">'+
            (dDung==null?'—':tien(dDung))+'</td>'+
          '<td class="phai">'+oNhapSo(p.id,'nuoc_cu',nCu,!coNuoc)+'</td>'+
          '<td class="phai">'+oNhapSo(p.id,'nuoc',nMoi,!coNuoc)+'</td>'+
          '<td class="phai dung'+(nDung!=null&&nDung<0?' am':'')+'" data-dung="'+esc(p.id)+'|nuoc">'+
            (coNuoc?(nDung==null?'—':tien(nDung)):'khoán')+'</td>'+
          '<td>'+nhanTT(cD)+'</td></tr>';
      }).join('') : '<tr><td colspan="9" style="color:var(--chu-mo)">Không có phòng nào.</td></tr>')+
      '</tbody></table></div>'+
      '<div class="hang-luu-cs">'+
        nutT('luu-cs','Lưu tất cả chỉ số')+
        '<span class="nha-pc" id="cs-nhac">Chỉ những dòng anh vừa gõ mới được ghi.</span>'+
      '</div></div>';

    /* Tính lại ô Dùng ngay khi gõ */
    document.getElementById('noi-cs').addEventListener('input', function(e){
      var o=e.target; if(!o.classList || !o.classList.contains('o-so')) return;
      var pid=o.dataset.p, loai=o.dataset.l.replace('_cu','');
      var oCu=document.querySelector('.o-so[data-p="'+pid+'"][data-l="'+loai+'_cu"]');
      var oMoi=document.querySelector('.o-so[data-p="'+pid+'"][data-l="'+loai+'"]');
      var o2=document.querySelector('[data-dung="'+pid+'|'+loai+'"]');
      if(!oCu||!oMoi||!o2) return;
      var a=oCu.value===''?null:Number(oCu.value), b=oMoi.value===''?null:Number(oMoi.value);
      var d = (a!=null&&b!=null) ? b-a : null;
      o2.textContent = d==null?'—':tien(d);
      o2.classList.toggle('am', d!=null && d<0);
      oMoi.classList.toggle('loi', d!=null && d<0);

/* Lùi một kỳ: 2026-09-01 -> 2026-08-01 */
function kyLui(k){
  var n=Number(String(k).slice(0,4)), t=Number(String(k).slice(5,7))-1;
  if(t<1){ t=12; n-=1; }
  return n+'-'+('0'+t).slice(-2)+'-01';
}

function doiTrangThai(b){
  var id=b.dataset.duyet||b.dataset.bo, duyet=!!b.dataset.duyet;
  b.disabled=true; b.textContent = duyet?'Đang duyệt…':'Đang bỏ…';
  ghi('chi_so?id=eq.'+encodeURIComponent(id),'PATCH',
      {trang_thai_duyet: duyet?'da_duyet':'da_bo'})
    .then(function(){ banh(duyet?'Đã duyệt. Số này vào được hóa đơn.':'Đã bỏ.'); moMan('chiso'); })
    .catch(function(er){ b.disabled=false; b.textContent=duyet?'Duyệt':'Bỏ';
                         banh('Không xong: '+(er.message||er)); });
}

function luuChiSo(nut, dsPhong, cuaNay, cuCua){
  var rows=[], loi=[];
  dsPhong.forEach(function(p){
    ['dien','nuoc'].forEach(function(loai){
      var oCu=document.querySelector('.o-so[data-p="'+p.id+'"][data-l="'+loai+'_cu"]');
      var oMoi=document.querySelector('.o-so[data-p="'+p.id+'"][data-l="'+loai+'"]');
      if(!oMoi || oMoi.disabled || oMoi.value==='') return;
      var moi=Number(oMoi.value);
      var cu = (oCu && oCu.value!=='') ? Number(oCu.value) : cuCua(p.id, loai);
      if(cu==null){ loi.push(p.ma_nha+' '+p.ma_phong+' ('+(loai==='dien'?'điện':'nước')+'): chưa có chỉ số kỳ trước, điền giúp tôi ô bên trái'); return; }
      if(moi<cu){ loi.push(p.ma_nha+' '+p.ma_phong+' ('+(loai==='dien'?'điện':'nước')+'): số kỳ này '+tien(moi)+' nhỏ hơn kỳ trước '+tien(cu)); return; }
      var cu2 = cuaNay[p.id+'|'+loai];
      if(cu2 && Number(cu2.chi_so_moi)===moi && Number(cu2.chi_so_cu)===cu
         && cu2.trang_thai_duyet==='da_duyet') return;   /* không đổi thì bỏ qua */
      rows.push({ phong_id:p.id, ky:csKy, loai_dich_vu:loai,
                  chi_so_cu:cu, chi_so_moi:moi, nguon:'go_tay',
                  trang_thai_duyet:'da_duyet',
                  nguoi_nhap_id: TOI?TOI.id:null, nguoi_duyet_id: TOI?TOI.id:null });
    });
  });

  if(loi.length){
    banh('Chưa lưu. '+loi.length+' dòng cần sửa: '+loi.slice(0,2).join(' · ')+(loi.length>2?'…':''));
    return;
  }
  if(!rows.length){ banh('Không có ô nào mới để lưu.'); return; }
  if(!hoiLai('Lưu '+rows.length+' chỉ số cho kỳ '+nhanKy(csKy)+'?\n\nSố gõ tay vào thẳng sổ, không phải chờ duyệt.')) return;

  nut.disabled=true; var cu=nut.textContent; nut.textContent='Đang lưu…';
  toChuc().then(function(tc){
    rows.forEach(function(r){ r.to_chuc_id=tc; });
    /* Ghi đè nếu phòng đó kỳ đó đã có dòng cùng loại */
    return ghi('chi_so?on_conflict=phong_id,ky,loai_dich_vu','POST',rows,
               'return=representation,resolution=merge-duplicates');
  })
  .then(function(){ banh('Đã lưu '+rows.length+' chỉ số. Giờ lập được hóa đơn kỳ '+nhanKy(csKy)+'.');
                    moMan('chiso'); })
  .catch(function(e){ nut.disabled=false; nut.textContent=cu;
                      banh('Không lưu được: '+(e.message||e)); });
}
