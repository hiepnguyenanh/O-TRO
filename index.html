<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ở TRỌ — AI Quản Lý Nhà Trọ</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nen:#F8F4EC; --the:#FFFFFF; --vien:#E9E0D0; --vien-nhat:#F1EADC;
  --chu:#2B2420; --chu-phu:#7A6F62; --chu-mo:#A79C8C;
  --xanh:#BD6B53; --xanh-nen:#FBEEE7; --xanh-dam:#9C5542;
  --do:#DC2626; --do-nen:#FEF2F2;
  --luc:#059669; --luc-nen:#ECFDF5;
  --vang:#B45309; --vang-nen:#FFFBEB;
  --tim:#8FA888;
  --bong:0 1px 2px rgba(43,36,32,.05);
  --bong2:0 4px 16px rgba(43,36,32,.08);
  --dai:linear-gradient(100deg,#FBF1E3 0%,#FAF6EC 46%,var(--the) 100%);
  --g1:linear-gradient(135deg,#C1684B,#9C5542); --g2:linear-gradient(135deg,#9FB896,#7A9972);
  --g3:linear-gradient(135deg,#F0A94E,#DE8A2C); --g4:linear-gradient(135deg,#12B981,#059669);
  --g5:linear-gradient(135deg,#EF4B6B,#D01F45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nen:#17130F; --the:#211B16; --vien:#352C23; --vien-nhat:#2A231C;
  --chu:#F1E9DD; --chu-phu:#B3A594; --chu-mo:#7F7364;
  --xanh:#E08A6B; --xanh-nen:#2E201A; --xanh-dam:#F0A080;
  --do:#F87171; --do-nen:#2A1719; --luc:#34D399; --luc-nen:#12241E;
  --vang:#FBBF24; --vang-nen:#26200F; --tim:#A8C09F;
  --bong:0 1px 2px rgba(0,0,0,.3); --bong2:0 4px 16px rgba(0,0,0,.4);
  --dai:linear-gradient(100deg,#271D16 0%,#201A14 46%,var(--the) 100%);
}}
:root[data-theme="dark"]{
  --nen:#17130F; --the:#211B16; --vien:#352C23; --vien-nhat:#2A231C;
  --chu:#F1E9DD; --chu-phu:#B3A594; --chu-mo:#7F7364;
  --xanh:#E08A6B; --xanh-nen:#2E201A; --xanh-dam:#F0A080;
  --do:#F87171; --do-nen:#2A1719; --luc:#34D399; --luc-nen:#12241E;
  --vang:#FBBF24; --vang-nen:#26200F; --tim:#A8C09F;
  --bong:0 1px 2px rgba(0,0,0,.3); --bong2:0 4px 16px rgba(0,0,0,.4);
  --dai:linear-gradient(100deg,#271D16 0%,#201A14 46%,var(--the) 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
html{zoom:1.15}
body{margin:0; background:var(--nen); color:var(--chu);
  font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
.an{display:none!important}

/* ================= ĐĂNG NHẬP ================= */
#man-dn{min-height:100%; display:grid; place-items:center; padding:24px}
.hop-dn{width:100%; max-width:400px; background:var(--the); border:1px solid var(--vien);
  border-radius:18px; box-shadow:var(--bong2); padding:32px 30px}
.hieu-dn{display:flex; align-items:center; gap:12px; margin-bottom:26px}
.dau-hieu{width:44px; height:44px; border-radius:12px; flex:none; display:block; object-fit:cover}
.hieu-dn b{display:block; font-size:21px; font-weight:700; letter-spacing:1px; line-height:1.2}
.hieu-dn span{font-size:12px; color:var(--chu-phu)}
.o-form{margin-bottom:15px}
.o-form label{display:block; font-size:12px; font-weight:700; letter-spacing:.6px;
  text-transform:uppercase; color:var(--chu-phu); margin-bottom:6px}
.o-form input{width:100%; background:var(--nen); border:1px solid var(--vien); border-radius:10px;
  padding:12px 14px; font:inherit; font-size:15.5px; color:var(--chu)}
.o-form input:focus{outline:2px solid var(--xanh); outline-offset:-1px; border-color:var(--xanh)}
.nut-dn{width:100%; background:var(--xanh); color:#fff; border:0; border-radius:10px;
  padding:13px; font:inherit; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; min-height:48px}
.nut-dn:hover{background:var(--xanh-dam)}
.nut-dn:disabled{opacity:.6; cursor:default}
.loi-dn{margin-top:14px; padding:11px 13px; border-radius:9px; background:var(--do-nen);
  color:var(--do); font-size:14px; border-left:3px solid var(--do)}
.ghi-dn{margin:18px 0 0; font-size:12.5px; color:var(--chu-mo); text-align:center}

/* ================= KHUNG APP ================= */
.khung{display:flex; min-height:100%}
.menu{width:242px; flex:0 0 242px; background:var(--the); border-right:1px solid var(--vien);
  padding:20px 12px 16px; display:flex; flex-direction:column; gap:16px}
.hieu{display:flex; align-items:center; gap:10px; padding:0 8px 2px}
.hieu-chu b{display:block; font-size:18px; font-weight:700; letter-spacing:1px; line-height:1.2}
.hieu-chu span{font-size:10.5px; font-weight:500; color:var(--chu-phu)}
.nhan-nhom{font-size:10.5px; font-weight:700; letter-spacing:.9px; text-transform:uppercase;
  color:var(--chu-mo); padding:0 10px; margin-bottom:6px}
.nhom{display:flex; flex-direction:column; gap:2px}
.nhom+.nhan-nhom{margin-top:16px}
.muc{position:relative; display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:9px; color:var(--chu-phu); text-decoration:none; font-size:15px; cursor:pointer;
  border:0; background:none; font:inherit; width:100%; text-align:left}
.muc svg{width:19px; height:19px; flex:none; opacity:.85}
.muc:hover{background:var(--vien-nhat); color:var(--chu)}
.muc.dang{background:var(--xanh-nen); color:var(--xanh); font-weight:600}
.dem{margin-left:auto; font-size:12px; font-weight:600; color:var(--chu-mo);
  background:var(--vien-nhat); border-radius:20px; padding:1px 8px; min-width:24px; text-align:center}
.muc.dang .dem{background:var(--xanh); color:#fff}
.day{margin-top:auto; border-top:1px solid var(--vien); padding-top:12px}

.than{flex:1; min-width:0; padding:0 0 48px; max-width:1500px; margin:0 auto; width:100%}
.dai{background:var(--dai); border-bottom:1px solid var(--vien); padding:26px 34px 0}
.duong-dan{font-size:13px; color:var(--chu-mo); margin:0 0 6px}
.duong-dan b{color:var(--chu-phu); font-weight:500}
.dai-tren{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px}
h1{font-size:31px; font-weight:700; letter-spacing:-.5px; margin:0; display:flex; align-items:center; gap:12px}
h1 .gach{width:6px; height:30px; border-radius:3px; background:linear-gradient(180deg,var(--xanh),var(--tim))}
.dai-phu{color:var(--chu-phu); font-size:15px; margin:6px 0 0 18px}
.so-nhanh{display:flex; flex-wrap:wrap; gap:34px; margin:20px 0 0}
.sn{padding-bottom:18px}
.sn b{display:block; font-size:24px; font-weight:700; letter-spacing:-.4px;
  font-variant-numeric:tabular-nums; line-height:1.2}
.sn span{font-size:13.5px; color:var(--chu-phu)}
.sn.tot b{color:var(--luc)} .sn.xau b{color:var(--do)}

.lo{display:grid; gap:16px; margin-bottom:16px}
.lo-5{grid-template-columns:repeat(5,1fr)}
.lo-4{grid-template-columns:repeat(4,1fr)}
.lo-2{grid-template-columns:repeat(2,1fr)}
.lo>*{min-width:0}
.than-1{padding:30px 34px 48px}
.mau{border-radius:13px; padding:19px 21px; color:#fff; min-height:112px;
  display:flex; flex-direction:column; justify-content:space-between}
.mau .ten{font-size:14.5px; font-weight:600; opacity:.95}
.mau .val{font-size:33px; font-weight:700; letter-spacing:-.8px; font-variant-numeric:tabular-nums}
.m1{background:var(--g1)} .m2{background:var(--g2)} .m3{background:var(--g3)}
.m4{background:var(--g4)} .m5{background:var(--g5)}
.the{background:var(--the); border:1px solid var(--vien); border-radius:13px; box-shadow:var(--bong)}
.the.o{padding:17px 19px}
.the.o .nhan{font-size:12px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--chu-phu)}
.the.o .val{font-size:26px; font-weight:700; margin-top:6px; letter-spacing:-.5px;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.the.o .val.xau{color:var(--do)} .the.o .val.tot{color:var(--luc)}
.khoi{padding:20px 22px}
.khoi h2{font-size:17.5px; font-weight:600; margin:0 0 4px}
.khoi .ghi{font-size:13.5px; color:var(--chu-phu); margin:0 0 14px}

.ds{padding:20px 34px 0; display:flex; flex-direction:column; gap:16px}
.cuon{overflow-x:auto; background:var(--the); border:1px solid var(--vien); border-radius:12px}
table{width:100%; border-collapse:collapse; font-size:15px}
th{text-align:left; font-size:12px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  color:var(--chu-phu); padding:13px 16px; border-bottom:1px solid var(--vien);
  background:var(--vien-nhat); white-space:nowrap}
th.phai,td.phai{text-align:right}
td{padding:13px 16px; border-bottom:1px solid var(--vien-nhat); font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--vien-nhat)}
td.ten{font-weight:600; font-variant-numeric:normal}
.hieu-nho{display:inline-block; font-size:13px; font-weight:600; padding:4px 11px;
  border-radius:20px; white-space:nowrap}
.h-luc{background:var(--luc-nen); color:var(--luc)}
.h-do{background:var(--do-nen); color:var(--do)}
.h-vang{background:var(--vang-nen); color:var(--vang)}
.h-xam{background:var(--vien-nhat); color:var(--chu-phu)}
.am{color:var(--do); font-weight:600} .duong{color:var(--luc); font-weight:600}

/* khối nhà + thẻ phòng */
.nha{background:var(--the); border:1px solid var(--vien); border-radius:13px;
  box-shadow:var(--bong); overflow:hidden}
.nha-bam{display:flex; align-items:center; gap:16px; padding:17px 20px; cursor:pointer;
  width:100%; border:0; background:none; font:inherit; text-align:left; color:inherit}
.nha-bam:hover{background:var(--vien-nhat)}
.ma-nha{width:44px; height:44px; border-radius:12px; flex:none; display:grid; place-items:center;
  background:linear-gradient(135deg,#6D4BEF,#4B2FC9); color:#fff; font-weight:700; font-size:13.5px}
.nha-ten{min-width:0; flex:1}
.nha-ten b{display:block; font-size:18px; font-weight:700}
.nha-ten span{display:block; font-size:14px; color:var(--chu-phu)}
.nha-so{display:flex; align-items:center; gap:9px; flex:none; flex-wrap:wrap; justify-content:flex-end}
.mui{width:20px; height:20px; color:var(--chu-mo); transition:transform .18s; flex:none}
.nha.mo .mui{transform:rotate(180deg)}
.nha-than{display:none; border-top:1px solid var(--vien); padding:16px 20px; background:var(--nen)}
.nha.mo .nha-than{display:block}
.the-phong{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px}
.ph{background:var(--the); border:1px solid var(--vien); border-radius:11px; padding:16px 17px;
  display:flex; flex-direction:column; gap:12px}
.ph.no{border-color:var(--do)} .ph.het{border-color:#F59E0B}
.ph.trong{background:var(--vang-nen)}
.ph-dau{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.ph-dau b{font-size:17px; font-weight:700; white-space:nowrap}
.ph-tt{display:flex; align-items:center; justify-content:space-between; gap:10px}
.ph-gia{font-size:21px; font-weight:700; letter-spacing:-.3px; font-variant-numeric:tabular-nums}
.ph-gia small{font-size:13.5px; font-weight:500; color:var(--chu-phu)}
.ph-khach{font-size:14px; color:var(--chu-phu)}
.ph-han{color:var(--vang); font-weight:600} .ph-qua{color:var(--do); font-weight:600}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:12.5px; font-weight:500; color:var(--chu-phu); background:var(--vien-nhat);
  border-radius:6px; padding:3px 9px; white-space:nowrap}
.chip.mb{background:#EDE9FE; color:#5B21B6}
.tt{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.4px;
  text-transform:uppercase; padding:5px 11px; border-radius:6px; white-space:nowrap}
.tt-thue{background:var(--luc); color:#fff} .tt-no{background:var(--do); color:#fff}
.tt-trong{background:var(--vien-nhat); color:var(--chu-phu)}

.loc-hang{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:20px 34px 0}
.loc{border:1px solid var(--vien); background:var(--the); color:var(--chu-phu); font:inherit;
  font-size:14.5px; border-radius:20px; padding:9px 16px; cursor:pointer; white-space:nowrap}
.loc:hover{border-color:var(--xanh); color:var(--chu)}
.loc.dang{background:var(--xanh); border-color:var(--xanh); color:#fff; font-weight:600}
.loc i{font-style:normal; font-size:12.5px; font-weight:600; background:var(--vien-nhat);
  border-radius:20px; padding:1px 7px; margin-left:6px; color:var(--chu-phu)}
.loc.dang i{background:rgba(255,255,255,.22); color:#fff}
.o-tim{flex:1; min-width:200px; position:relative}
.o-tim input{width:100%; background:var(--the); border:1px solid var(--vien); border-radius:10px;
  padding:12px 15px; font:inherit; font-size:15px; color:var(--chu)}
.o-tim input:focus{outline:2px solid var(--xanh); outline-offset:-1px; border-color:var(--xanh)}

.trang-thai{padding:60px 34px; text-align:center; color:var(--chu-mo); font-size:15px}
.trang-thai.loi{color:var(--do)}
.quay{display:inline-block; width:22px; height:22px; border:2.5px solid var(--vien);
  border-top-color:var(--xanh); border-radius:50%; animation:xoay .7s linear infinite; margin-bottom:12px}
@keyframes xoay{to{transform:rotate(360deg)}}
.chan{margin:30px 34px 0; padding-top:16px; border-top:1px solid var(--vien);
  font-size:13.5px; color:var(--chu-mo); display:flex; flex-wrap:wrap; gap:6px 18px}




/* ===== Nút trên dải tiêu đề ===== */
.nhom-nut{display:flex; flex-wrap:wrap; gap:9px}
.nut{background:var(--xanh); color:#fff; border:0; border-radius:9px; padding:11px 18px;
  font:inherit; font-size:15px; font-weight:600; cursor:pointer; display:inline-flex;
  align-items:center; gap:8px; min-height:44px; white-space:nowrap}
.nut:hover{background:var(--xanh-dam)}
.nut svg{width:17px; height:17px}
.nut.phu{background:var(--the); color:var(--chu-phu); border:1px solid var(--vien)}
.nut.phu:hover{background:var(--vien-nhat); color:var(--chu)}
.nut.luc{background:#0F7B4F} .nut.luc:hover{background:#0B6641}
.doi{display:inline-flex; background:var(--vien-nhat); border-radius:9px; padding:3px; gap:2px}
.doi button{border:0; background:transparent; color:var(--chu-phu); font:inherit; font-size:14.5px;
  padding:8px 14px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
.doi button svg{width:15px; height:15px}
.doi button.dang{background:var(--the); color:var(--chu); font-weight:600; box-shadow:var(--bong)}

/* ===== Nhắc ===== */
#banh{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--chu); color:var(--nen); padding:13px 20px; border-radius:11px; font-size:15px;
  box-shadow:var(--bong2); opacity:0; pointer-events:none; transition:.22s; z-index:99; max-width:90vw}
#banh.hien{opacity:1; transform:translateX(-50%) translateY(0)}

/* ===== Trợ Lý AI ===== */
.dong-ai{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:13px 15px; border:1px solid var(--vien); border-radius:11px; margin-bottom:9px}
.dong-ai b{display:block; font-size:15px} 
.dong-ai span{display:block; font-size:13px; color:var(--chu-phu)}
.dong-ai .so{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums}

/* ===== Giới hạn sử dụng ===== */
.thanhs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px}
.thanh-ten{display:flex; justify-content:space-between; font-size:14px; margin-bottom:7px}
.thanh-ten b{font-variant-numeric:tabular-nums}
.rang{height:7px; border-radius:20px; background:var(--vien-nhat); overflow:hidden}
.rang i{display:block; height:100%; background:var(--xanh)}

/* ===== Form cài đặt ===== */
.luoi-form{display:grid; grid-template-columns:1fr 1fr; gap:15px}
.o-form2 label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.6px;
  text-transform:uppercase; color:var(--chu-phu); margin-bottom:6px}
.o-form2 input{width:100%; background:var(--nen); border:1px solid var(--vien); border-radius:9px;
  padding:11px 13px; font:inherit; font-size:15px; color:var(--chu)}
.o-form2 input:focus{outline:2px solid var(--xanh); outline-offset:-1px}
.o-form2 .goi-y{font-size:12.5px; color:var(--chu-mo); margin-top:5px; display:block}
.bat-tat{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:13px 0; border-bottom:1px solid var(--vien-nhat)}
.bat-tat:last-child{border-bottom:0}
.bat-tat b{display:block; font-size:15px} .bat-tat span{display:block; font-size:13px; color:var(--chu-phu)}
.cong{position:relative; width:46px; height:26px; flex:none}
.cong input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:1}
.cong i{position:absolute; inset:0; background:var(--vien); border-radius:20px; transition:.2s}
.cong i::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
  background:#fff; border-radius:50%; transition:.2s}
.cong input:checked + i{background:var(--luc)}
.cong input:checked + i::after{transform:translateX(20px)}
.canh-bao{display:flex; gap:11px; align-items:flex-start; background:var(--vang-nen);
  border:1px solid var(--vang); border-radius:11px; padding:13px 15px; font-size:14.5px; margin-bottom:14px}
.canh-bao svg{width:19px; height:19px; flex:none; color:var(--vang); margin-top:2px}
@media (max-width:760px){.luoi-form{grid-template-columns:1fr}}
/* ===== Bảng người dùng và vai trò ===== */
.o-ten{display:flex; align-items:center; gap:10px}
.avt{width:32px; height:32px; border-radius:50%; background:var(--xanh-nen); color:var(--xanh);
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none}
.vai{display:inline-block; font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:20px; white-space:nowrap}
.v-chu{background:var(--xanh-nen); color:var(--xanh)}
.v-ql{background:var(--vang-nen); color:var(--vang)}
.v-kt{background:var(--vien-nhat); color:var(--chu-phu)}
.nha-pc{font-size:13.5px; color:var(--chu-phu)}
.toi-la{display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  padding:10px 12px 14px; font-size:14.5px; line-height:1.3}
.toi-la b{font-weight:650; color:var(--chu)}
.khoa-vai{border-style:dashed}
.o-so{width:112px; background:var(--nen); border:1px solid var(--vien); border-radius:8px;
  padding:9px 10px; font:inherit; font-size:15.5px; color:var(--chu); text-align:right; min-height:42px}
.o-so:focus{outline:2px solid var(--xanh); outline-offset:1px; background:var(--the)}
.o-so.loi{border-color:var(--do); background:var(--do-nen)}
.o-so:disabled{background:var(--vien-nhat); color:var(--chu-mo)}
tr.cho-duyet{background:var(--vang-nen)}
.dung{font-weight:650}
.dung.am{color:var(--do)}
.hang-luu-cs{position:sticky; bottom:0; display:flex; gap:14px; align-items:center;
  padding:14px 0 2px; background:var(--the); border-top:1px solid var(--vien); margin-top:6px; flex-wrap:wrap}
tr.da-xoa td{opacity:.55; text-decoration:line-through}
tr.da-xoa td:last-child{opacity:1; text-decoration:none}
.dau-sua{display:inline-block; margin-left:7px; font-size:12px; font-weight:600;
  color:var(--vang); background:var(--vang-nen); padding:2px 8px; border-radius:20px;
  white-space:nowrap; text-decoration:none}
.hang-xoa{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 14px}
.bang-nk{width:100%; border-collapse:collapse; font-size:15px}

<script>
(function(){
"use strict";

/* ============ CẤU HÌNH ============ */
var URL_KHO = "https://atculcdzkpnvzxqtkibh.supabase.co";
var KHOA_CHUNG = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y3VsY2R6a3Budnp4cXRraWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTk5NDMsImV4cCI6MjEwNzI3NTk0M30.kJxEVItET9xfEpR7MZpSjdRM4Mg4iScvJtF90j4v7M0";
var KHOA_LUU = "o-tro-phien";

/* ============ TIỆN ÍCH ============ */
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function tien(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function ngay(d){ if(!d) return '—'; var p=String(d).slice(0,10).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(d); }
function banh(t){
  var e=document.getElementById('banh'); e.textContent=t; e.classList.add('hien');
  clearTimeout(banh._t); banh._t=setTimeout(function(){ e.classList.remove('hien'); }, 3200);
}
function chuaBat(){ banh('Thêm và sửa dữ liệu sẽ bật ở bước sau. Bản này đọc số thật, chưa ghi.'); }
function homNay(){ return new Date().toISOString().slice(0,10); }
/* Phần trăm kiểu Việt Nam: dấu phẩy thập phân */
function thang(v){ return v==null || v==='' ? '—'
  : Number(v).toFixed(1).replace('.',',')+' tháng'; }
function pt(v){ return v==null?'—':String(v).replace('.',',')+'%'; }

var phien = null;
try { var t=localStorage.getItem(KHOA_LUU); if(t) phien=JSON.parse(t); } catch(e){}

function luuPhien(p){ phien=p; try{ localStorage.setItem(KHOA_LUU, JSON.stringify(p)); }catch(e){} }
function xoaPhien(){ phien=null; TOI=null; try{ localStorage.removeItem(KHOA_LUU); }catch(e){} }

/* ---------- VAI TRÒ NGƯỜI ĐANG ĐĂNG NHẬP ----------
   Kho dữ liệu đã chặn thật theo vai trò (file 09). Phần này chỉ để
   màn hình không bày ra thứ người đó không được xem — chặn thật nằm
   ở kho, không nằm ở đây. */
var TOI = null;
var TEN_VAI = {chu_tro:'Chủ trọ', quan_ly:'Quản lý', ke_toan:'Kế toán'};
function laChuTro(){  return !!(TOI && TOI.vai_tro==='chu_tro'); }
function laVanHanh(){ return !!(TOI && (TOI.vai_tro==='chu_tro' || TOI.vai_tro==='quan_ly')); }
function tenVai(v){   return TEN_VAI[v] || v || '—'; }
function docToi(){
  var sub=null;
  try{
    var g = phien.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    sub = JSON.parse(atob(g + '==='.slice((g.length+3)%4))).sub;
  }catch(e){}
  if(!sub){ TOI=null; return Promise.resolve(null); }
  return lay('nguoi_dung?select=id,ho_ten,vai_tro&id=eq.'+encodeURIComponent(sub))
    .then(function(d){ TOI=(d&&d[0])||null; return TOI; })
    .catch(function(){ TOI=null; return null; });
}
function veVaiTro(){
  var o=document.getElementById('toi-la');
  if(!o) return;
  o.innerHTML = TOI
    ? '<b>'+esc(TOI.ho_ten||'')+'</b><span class="vai v-'+
      (TOI.vai_tro==='chu_tro'?'chu':TOI.vai_tro==='quan_ly'?'ql':'kt')+'">'+esc(tenVai(TOI.vai_tro))+'</span>'
    : '';
}
/* Ô trống thay cho thứ vai trò này không được xem */
function khongDuocXem(gi){
  return '<div class="the khoi khoa-vai"><h2>'+esc(gi)+'</h2>'+
    '<p class="ghi">Phần này chỉ Chủ trọ xem được. Tài khoản '+esc(tenVai(TOI&&TOI.vai_tro))+
    ' của anh không mở được số tiền thuê sỉ và lãi lỗ — kho dữ liệu chặn, không phải màn hình ẩn đi.</p></div>';
}

/* ============ GỌI KHO DỮ LIỆU ============ */
function dangNhap(email, mk){
  return fetch(URL_KHO+'/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':KHOA_CHUNG,'Content-Type':'application/json'},
    body: JSON.stringify({email:email, password:mk})
  }).then(function(r){ return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ('Lỗi '+r.status));
      return j; }); });
}

function lay(duong){
  if(!phien) return Promise.reject(new Error('Chưa đăng nhập'));
  return fetch(URL_KHO+'/rest/v1/'+duong, {
    headers:{'apikey':KHOA_CHUNG,'Authorization':'Bearer '+phien.access_token}
  }).then(function(r){
    if(r.status===401){ xoaPhien(); hienDangNhap('Phiên đã hết hạn, đăng nhập lại giúp tôi.'); throw new Error('401'); }
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j.message || j.hint || ('Lỗi '+r.status));
      return j; }); });
}

/* ---------- Ghi dữ liệu ----------
   Dùng đúng phiên đăng nhập của người dùng, nên luật bảo mật
   của kho dữ liệu vẫn canh như thường. Không có khóa quản trị ở đây. */
function ghi(duong, cach, than, prefer){
  if(!phien) return Promise.reject(new Error('Chưa đăng nhập'));
  return fetch(URL_KHO+'/rest/v1/'+duong, {
    method: cach,
    headers: {'apikey':KHOA_CHUNG, 'Authorization':'Bearer '+phien.access_token,
              'Content-Type':'application/json',
              'Prefer': prefer || 'return=representation'},
    body: than ? JSON.stringify(than) : undefined
  }).then(function(r){
    if(r.status===401){ xoaPhien(); hienDangNhap('Phiên đã hết hạn, đăng nhập lại giúp tôi.'); throw new Error('401'); }
    if(r.status===204) return null;
    return r.text().then(function(t){
      var j=null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
      if(!r.ok) throw new Error(dichLoi(j, r.status));
      return j;
    });
  });
}
/* Đổi lời báo lỗi của kho dữ liệu sang tiếng người dùng hiểu được */
function dichLoi(j, ma){
  var m = (j && (j.message || j.hint || j.details)) || ('Lỗi '+ma);
  if(/duplicate key|already exists/i.test(m)) return 'Bản ghi này đã có rồi. Kiểm tra lại mã hoặc kỳ.';
  if(/row-level security/i.test(m))          return 'Tài khoản này không có quyền ghi vào đó.';
  if(/foreign key/i.test(m))                 return 'Có ô đang trỏ tới thứ không còn tồn tại. Chọn lại giúp tôi.';
  if(/null value|not-null/i.test(m))         return 'Còn ô bắt buộc chưa điền.';
  if(/invalid input syntax/i.test(m))        return 'Có ô điền sai kiểu — ví dụ chữ nằm trong ô số.';
  if(/check constraint/i.test(m))            return 'Giá trị không hợp lệ: '+m;
  if(/Failed to fetch|NetworkError/i.test(m))return 'Mất kết nối tới kho dữ liệu. Kiểm tra mạng rồi thử lại.';
  return m;
}

/* Mã tổ chức — mọi bản ghi mới đều phải mang, luật bảo mật soi cái này */
var TC_ID = null;
function toChuc(){
  if(TC_ID) return Promise.resolve(TC_ID);
  return lay('to_chuc?select=id&limit=1').then(function(t){
    if(!t || !t.length) throw new Error('Kho dữ liệu chưa có tổ chức nào.');
    TC_ID = t[0].id; return TC_ID;
  });

function moHop(c){

  che.innerHTML='<div class="hop" role="dialog" aria-modal="true" aria-label="'+esc(c.ten)+'">'+
    '<div class="hop-dau"><h2>'+esc(c.ten)+'</h2>'+(c.mo?'<p>'+esc(c.mo)+'</p>':'')+'</div>'+

      '<button class="nut phu" type="button" id="hop-thoi">Thôi</button>'+
      '<button class="nut" type="button" id="hop-luu">'+esc(c.nutLuu||'Lưu')+'</button>'+
    '</div></div>';
  document.body.appendChild(che);

  var nutLuu=che.querySelector('#hop-luu'), oLoi=che.querySelector('#hop-loi');
  function dong(){ che.remove(); document.removeEventListener('keydown', phim); }
  function phim(e){ if(e.key==='Escape') dong(); }
  document.addEventListener('keydown', phim);
  che.querySelector('#hop-thoi').addEventListener('click', dong);
  che.addEventListener('mousedown', function(e){ if(e.target===che) dong(); });

  var dau=che.querySelector('input,select,textarea'); if(dau) dau.focus();
  if(c.moXong) c.moXong(che);

  nutLuu.addEventListener('click', function(){
    var gt=docO(c.o);
    var loi = c.kiem ? c.kiem(gt) : null;
    if(loi){ oLoi.textContent=loi; oLoi.classList.remove('an'); return; }
    oLoi.classList.add('an');
    nutLuu.disabled=true; var cu=nutLuu.textContent; nutLuu.textContent='Đang lưu…';
    Promise.resolve(c.luu(gt)).then(function(){
      dong();
      /* c.xong === false nghĩa là chính lệnh đó tự báo, đừng đè lên */
      if(c.xong !== false) banh(c.xong || 'Đã lưu.');
      if(c.xongThi) c.xongThi();
    }).catch(function(e){
      oLoi.textContent=String(e && e.message || e); oLoi.classList.remove('an');
      nutLuu.disabled=false; nutLuu.textContent=cu;
    });
  });

}

/* ---------- Biểu đồ cột: lấp đầy theo căn ---------- */
function veCot(id, CAN, HV){
  var s=document.getElementById(id); if(!s) return; s.textContent='';
  var W=520,H=224,L=38,R=12,T=18,B=34, pw=W-L-R, ph=H-T-B;
  var y=function(v){ return T+ph-(v/100)*ph; };
  [0,25,50,75,100].forEach(function(g){
    s.appendChild(sel('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),stroke:bien('--vien'),'stroke-width':1}));
    var tx=sel('text',{x:L-8,y:y(g)+4,'text-anchor':'end','font-size':11,fill:bien('--chu-mo')});
    tx.textContent=g+'%'; s.appendChild(tx);
  });
  if(!CAN.length) return;
  var bw=Math.min(46,(pw/CAN.length)*0.52);
  CAN.forEach(function(d,i){
    var cx=L+(pw/CAN.length)*(i+0.5), h=Math.max(0,(d.v/100)*ph);
    if(h>0) s.appendChild(sel('rect',{x:cx-bw/2,y:y(d.v),width:bw,height:h,rx:4,fill:bien('--xanh')}));
    else s.appendChild(sel('rect',{x:cx-bw/2,y:y(0)-3,width:bw,height:3,rx:1.5,fill:bien('--vien')}));
    var lb=sel('text',{x:cx,y:y(d.v)-8,'text-anchor':'middle','font-size':11.5,'font-weight':600,fill:bien('--chu')});
    lb.textContent=String(d.v).replace('.',',')+'%'; s.appendChild(lb);
    var nm=sel('text',{x:cx,y:H-12,'text-anchor':'middle','font-size':12,fill:bien('--chu-phu')});
    nm.textContent=d.t; s.appendChild(nm);
    var hv=HV[d.t];
    if(hv!=null) s.appendChild(sel('line',{x1:cx-bw/2-5,x2:cx+bw/2+5,y1:y(hv),y2:y(hv),
      stroke:bien('--do'),'stroke-width':1.5,'stroke-dasharray':'4 3'}));
  });
}

/* ---------- Biểu đồ đường: thu chi theo tháng ---------- */
function veThang(id, NHAN, THU, CHI){
  var s=document.getElementById(id); if(!s) return; s.textContent='';
  var W=520,H=224,L=48,R=22,T=18,B=34, pw=W-L-R, ph=H-T-B;
  var max=Math.max.apply(null, THU.concat(CHI).concat([1]));
  var buoc=Math.pow(10,Math.floor(Math.log(max/4)/Math.LN10||0));
  max=Math.ceil(max/(buoc*4))*(buoc*4) || 1;
  var y=function(v){ return T+ph-(v/max)*ph; };
  var x=function(i){ return L+(pw/Math.max(NHAN.length-1,1))*i; };
  for(var g=0; g<=4; g++){
    var v=max/4*g;
    s.appendChild(sel('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:bien('--vien'),'stroke-width':1}));
    var tx=sel('text',{x:L-8,y:y(v)+4,'text-anchor':'end','font-size':11,fill:bien('--chu-mo')});
    tx.textContent=(v/1000000).toFixed(0)+'tr'; s.appendChild(tx);
  }
  NHAN.forEach(function(t,i){
    var tx=sel('text',{x:x(i),y:H-12,'text-anchor':'middle','font-size':11.5,fill:bien('--chu-phu')});
    tx.textContent=t; s.appendChild(tx);
  });
  [[THU,'#0F7B4F','Thu'],[CHI,'#C2410C','Chi']].forEach(function(p){
    var d=p[0].map(function(v,i){ return (i?'L':'M')+x(i)+' '+y(v); }).join(' ');
    s.appendChild(sel('path',{d:d,fill:'none',stroke:p[1],'stroke-width':2.2,
      'stroke-linecap':'round','stroke-linejoin':'round'}));
    p[0].forEach(function(v,i){
      s.appendChild(sel('circle',{cx:x(i),cy:y(v),r:3.5,fill:p[1],stroke:bien('--the'),'stroke-width':2}));
    });
  });
}

          if(p) choThue(p, dsKhach, lam);

          var pg=null; ps.forEach(function(x){ if(String(x.hop_dong_id)===t.dataset.giahan) pg=x; });
          if(pg) giaHan(pg, lam);
        } else {
          var pt=null; ps.forEach(function(x){ if(String(x.hop_dong_id)===t.dataset.tra) pt=x; });
          if(pt) traPhong(pt, lam);
        }
        return;
      }
      var b=e.target.closest('.nha-bam'); if(!b) return;
      b.closest('.nha').classList.toggle('mo');
    });

    el.addEventListener('click', function(e){
      var b=e.target.closest('[data-lam]'); if(!b) return;
      if(b.dataset.lam==='them-nha') themNha(function(){ moMan('nha'); });
      else if(b.dataset.lam==='them-phong') themPhong(dsNha, function(){ moMan('nha'); });
    });
  }).catch(function(e){ el.innerHTML=daiHeader('Nhà trọ','')+baoLoi(e); });
}

/* ---------- Hộp chỉ để đọc, không có ô nhập ---------- */
function moXem(ten, mo, noiDung){
  var che=document.createElement('div'); che.className='man-che';
  che.innerHTML='<div class="hop" role="dialog" aria-modal="true" aria-label="'+esc(ten)+'">'+
    '<div class="hop-dau"><h2>'+esc(ten)+'</h2>'+(mo?'<p>'+esc(mo)+'</p>':'')+'</div>'+
    '<div class="hop-than">'+noiDung+'</div>'+
    '<div class="hop-chan"><button class="nut" type="button" id="hop-thoi">Đóng</button></div></div>';
  document.body.appendChild(che);
  function dong(){ che.remove(); document.removeEventListener('keydown', phim); }
  function phim(e){ if(e.key==='Escape') dong(); }
  document.addEventListener('keydown', phim);
  che.querySelector('#hop-thoi').addEventListener('click', dong);
  che.addEventListener('mousedown', function(e){ if(e.target===che) dong(); });
}

/* ---------- Nhật ký sửa của một phiếu ----------
   Nhật ký do trigger của kho dữ liệu ghi, không do màn hình ghi.
   Không ai sửa hay xóa được dòng nào trong đó, kể cả Chủ trọ. */
var TEN_TRUONG = {
  ngay:'Ngày', loai:'Loại', hang_muc:'Hạng mục', nha_tro_id:'Nhà trọ',
  so_tien:'Số tiền', hinh_thuc:'Hình thức', dien_giai:'Diễn giải',
  ngay_thanh_toan:'Ngày nhận tiền', ma_giao_dich:'Mã giao dịch', noi_dung:'Nội dung',
  nguoi_thu:'Người thu tiền'
};
function giaTri(truong, v){
  if(v==null || v==='') return '(để trống)';
  if(truong==='so_tien') return tien(v)+' đ';
  if(truong==='ngay' || truong==='ngay_thanh_toan') return ngay(v);
  if(truong==='hinh_thuc') return v==='tien_mat'?'Tiền mặt':v==='chuyen_khoan'?'Chuyển khoản':v;
  if(truong==='loai') return v==='thu'?'Thu':'Chi';
  return String(v);
}
function lucDay(t){
  if(!t) return '—';
  var d=new Date(t);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+
         ' lúc '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function xemNhatKy(banGhiId, tieuDe){
  lay('nhat_ky_sua?select=*&ban_ghi_id=eq.'+encodeURIComponent(banGhiId)+'&order=stt.desc')
    .then(function(ds){
      var noi = !ds.length
        ? '<p style="color:var(--chu-mo);font-size:15.5px">Phiếu này chưa bị sửa lần nào.</p>'
        : '<div class="cuon"><table class="bang-nk"><thead><tr><th>Lúc</th><th>Ai</th>'+
          '<th>Việc</th><th>Thay đổi</th></tr></thead><tbody>'+
          ds.map(function(n){
            var viec, doi;
            if(n.hanh_dong==='xoa'){
              viec='Xóa phiếu';
              doi = n.gia_tri_moi ? 'Lý do: '+esc(n.gia_tri_moi) : '(không ghi lý do)';
            } else if(n.hanh_dong==='khoi_phuc'){
              viec='Khôi phục'; doi='Phiếu trở lại sổ';
            } else {
              viec='Sửa '+esc(TEN_TRUONG[n.truong]||n.truong);
              doi='<span class="nk-cu">'+esc(giaTri(n.truong,n.gia_tri_cu))+'</span> → '+
                  '<span class="nk-moi">'+esc(giaTri(n.truong,n.gia_tri_moi))+'</span>';
            }
            return '<tr><td>'+esc(lucDay(n.luc))+'</td><td>'+esc(n.nguoi_ten||'—')+'</td>'+
                   '<td>'+viec+'</td><td>'+doi+'</td></tr>';
          }).join('')+'</tbody></table></div>';
      moXem('Nhật ký sửa', tieuDe+' · kho dữ liệu tự ghi, không ai xóa được dòng nào', noi);
    })
    .catch(function(e){ banh('Không đọc được nhật ký: '+(e.message||e)); });
}

/* ---------- Ô chọn hạng mục: đúng thứ tự anh vận hành, có số thứ tự ----------
   Bỏ mục cũ đã thôi dùng và mục "Thu tiền hóa đơn" (hệ thống tự sinh).
   Riêng khi sửa phiếu cũ đang mang mục cũ thì vẫn hiện mục đó. */
function chonHangMuc(ds, loai, dangCo){
  return ds.filter(function(h){
      return h.loai===loai && h.ma!=='thu_hoa_don' && (h.dang_dung!==false || h.ma===dangCo); })
    .sort(function(a,b){ return (a.thu_tu||50)-(b.thu_tu||50) || String(a.ten).localeCompare(String(b.ten)); })
    .map(function(h){
      var so = (h.thu_tu && h.thu_tu<=13 && !(loai==='thu' && h.thu_tu>7)) ? h.thu_tu+'. ' : '';
      return [h.ma, so+h.ten+(h.dang_dung===false?' (mục cũ)':'')]; });
}

       chon:[['tien_mat','Tiền mặt'],['chuyen_khoan','Chuyển khoản']]},

      {id:'dien_giai', nhan:'Diễn giải', kieu:'dai', rong:true, gt:g.dien_giai||''}
    ],
    nutLuu:'Lưu thay đổi', xong:'Đã sửa phiếu. Thay đổi đã vào nhật ký.',
    kiem:function(v){
      if(!v.so_tien || v.so_tien<=0) return 'Số tiền phải lớn hơn 0.';
      if(v.so_tien > 900000000) return 'Số tiền lớn bất thường. Kiểm tra lại có thừa số 0 không.';

    },
    luu:function(g){
      var ketThuc = ngayCong(g.ngay_bat_dau, g.so_thang);
      return toChuc().then(function(tc){
        return ghi('hop_dong','POST',[{
          to_chuc_id:tc, phong_id:p.id, khach_thue_id:g.khach_thue_id,
          so_hop_dong: soHopDongMoi(p.ma_nha, p.ma_phong, g.ngay_bat_dau),
          ngay_bat_dau:g.ngay_bat_dau, so_thang:g.so_thang, ngay_ket_thuc:ketThuc,
          gia_thue:g.gia_thue, tien_coc:g.tien_coc||0,
          ngay_thanh_toan:g.ngay_thanh_toan||5,
          don_gia_nuoc:g.don_gia_nuoc||0,
          trang_thai:'hieu_luc', ghi_chu:g.ghi_chu||null
        }]);
      });
    },
    xongThi:xongThi
  });
}

/* ---------- Gia hạn hợp đồng đang có ---------- */
function giaHan(p, xongThi){
  var tuNgay = p.ngay_ket_thuc && p.ngay_ket_thuc >= homNayVN()
    ? ngayCong(p.ngay_ket_thuc, 0) : homNayVN();
  moHop({
    ten:'Gia hạn '+p.ma_nha+' '+p.ma_phong,
    mo:'Khách '+(p.khach_thue||'—')+' · hợp đồng hiện hết hạn '+ngay(p.ngay_ket_thuc)+
       (p.hop_dong_het_han?' — ĐÃ QUÁ HẠN':''),
    o:[
      {id:'so_thang', nhan:'Gia hạn thêm mấy tháng', kieu:'so', gt:12, batBuoc:true},
      {id:'ngay_bat_dau', nhan:'Tính từ ngày', kieu:'ngay', gt:tuNgay, batBuoc:true,
       goi:'Mặc định là ngày liền sau ngày hết hạn cũ'},
      {id:'gia_thue', nhan:'Giá thuê mới mỗi tháng (đồng)', kieu:'so', gt:Number(p.gia_thue)||0, batBuoc:true,
       goi:'Giữ nguyên nếu không tăng giá'}
    ],
    nutLuu:'Gia hạn', xong:'Đã gia hạn hợp đồng.',
    kiem:function(g){
      if(!g.so_thang || g.so_thang<1 || g.so_thang>60) return 'Số tháng phải từ 1 tới 60.';
      if(!g.gia_thue || g.gia_thue<=0) return 'Giá thuê phải lớn hơn 0.';
      return null;
    },
    luu:function(g){
      return ghi('hop_dong?id=eq.'+encodeURIComponent(p.hop_dong_id),'PATCH',{
        ngay_bat_dau:g.ngay_bat_dau, so_thang:g.so_thang,
        ngay_ket_thuc: ngayCong(g.ngay_bat_dau, g.so_thang),
        gia_thue:g.gia_thue, trang_thai:'hieu_luc'
      });
    },
    xongThi:xongThi
  });
}

/* ---------- Trả phòng: kết thúc hợp đồng ---------- */
function traPhong(p, xongThi){
  var no = Number(p.dang_no)||0;
  moHop({
    ten:'Trả phòng '+p.ma_nha+' '+p.ma_phong,
    mo:'Kết thúc hợp đồng của '+(p.khach_thue||'khách')+'. Phòng chuyển sang Đang trống.'+
       (no>0 ? ' Phòng này còn nợ '+tien(no)+' đ.' : ''),

/* ---------- KHÁCH THUÊ ---------- */
var kTab='ds';
var kLoc={nha:'', kb:'', tu:''}, kXoa=false;
function manKhach(el){

    lay('khach_thue?select=*&order=ho_ten'),

  ]).then(function(kq){
    var ks=kq[0], ps=kq[1], nhas=kq[2];
    var oDau={}, nhaCua={};
    ps.forEach(function(p){ if(p.khach_thue_id){ oDau[p.khach_thue_id]=p.ma_nha+' · '+p.ma_phong; nhaCua[p.khach_thue_id]=p.ma_nha; } });

    var coCC = duyet.filter(function(k){return k.so_dinh_danh;}).length;

    el.innerHTML = daiHeader('Khách thuê', duyet.length+' khách trong sổ · '+daKB+' đã khai báo tạm trú',
      'Vận hành',
      (laVanHanh()? nutT('them-khach','Thêm khách thuê mới','',CONG) : '')+
      nutT('xuat-khach','Xuất Excel','phu','<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>'),
      tabB('ds','Danh sách khách',duyet.length,kTab==='ds')+
      tabB('ai','Trợ Lý AI Nhập',cho.length,kTab==='ai'))+
      '<div id="noi-k"></div>';

    document.getElementById('so-nhanh').innerHTML =
      '<div class="sn"><b>'+duyet.length+'</b><span>Khách trong sổ</span></div>'+
      '<div class="sn tot"><b>'+daKB+'</b><span>Đã khai báo tạm trú</span></div>'+
      '<div class="sn'+(duyet.length-daKB?' xau':'')+'"><b>'+(duyet.length-daKB)+'</b><span>Chưa khai báo</span></div>'+
      '<div class="sn'+(duyet.length-coCC?' xau':'')+'"><b>'+(duyet.length-coCC)+'</b><span>Chưa có số căn cước</span></div>';

    function ch(id,nhan,ds,gt){
      return '<div><label for="'+id+'">'+nhan+'</label><select id="'+id+'">'+
        ds.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===gt?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+
        '</select></div>';
    }
    function locK(){
      var tu=(kLoc.tu||'').toLowerCase().trim();
      return (kXoa?daXoa:duyet).filter(function(k){
        if(kLoc.nha==='_khong' && nhaCua[k.id]) return false;
        if(kLoc.nha && kLoc.nha!=='_khong' && nhaCua[k.id]!==kLoc.nha) return false;
        if(kLoc.kb==='da' && !k.da_khai_bao) return false;
        if(kLoc.kb==='chua' && k.da_khai_bao) return false;
        if(tu && ((k.ho_ten||'')+' '+(k.sdt||'')+' '+(k.so_dinh_danh||'')).toLowerCase().indexOf(tu)<0) return false;
        return true;
      });

    function veTab(id){

      var n=document.getElementById('noi-k');
      if(id==='ds'){
        n.innerHTML =
          '<div class="khoi-loc" id="loc-k" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">'+
            ch('k-nha','Nhà trọ',[['','Tất cả các nhà']].concat(nhas.map(function(x){ return [x.ma_nha,'Nhà trọ '+x.ma_nha]; }))
               .concat([['_khong','Chưa ở phòng nào']]), kLoc.nha)+
            ch('k-kb','Tạm trú',[['','Tất cả'],['chua','Chưa khai báo'],['da','Đã khai báo']], kLoc.kb)+
            '<div><label for="tim-k">Tìm</label><input id="tim-k" type="search" value="'+esc(kLoc.tu)+'" '+
            'placeholder="Tên, số điện thoại, số căn cước..." '+
            'style="width:100%;background:var(--nen);border:1px solid var(--vien);border-radius:9px;padding:11px 13px;font:inherit;font-size:15px;color:var(--chu);min-height:44px"></div>'+
          '</div>'+
          '<div class="ds">'+
          (laVanHanh() && (daXoa.length || kXoa) ? '<div class="hang-xoa"><button class="nut phu" type="button" data-lam="doi-xoa-k">'+
            (kXoa?'← Về danh sách đang dùng':'Hiện khách đã xóa ('+daXoa.length+')')+'</button>'+
            (kXoa?'<span class="nha-pc">Khách đã xóa không hiện ở đâu khác. Bấm Khôi phục là trở lại sổ.</span>':'')+'</div>' : '')+
          '<div class="cuon"><table><thead><tr>'+
          '<th>Khách thuê</th><th>Điện thoại</th><th>CMND/CCCD</th><th>Đang ở</th><th>Tạm trú</th><th>Thao tác</th>'+
          '</tr></thead><tbody id="tb-k"></tbody></table></div>'+
          '<p class="chan" style="margin:14px 0 0" id="chan-k"></p></div>';
        ve();
        document.getElementById('loc-k').addEventListener('change', function(){
          kLoc.nha=document.getElementById('k-nha').value; kLoc.kb=document.getElementById('k-kb').value; ve(); });
        document.getElementById('tim-k').addEventListener('input', function(){ kLoc.tu=this.value; ve(); });
      } else {
        n.innerHTML = '<div class="ds">'+
          '<p class="nhac-tab">Khách do Trợ Lý AI đọc từ ảnh căn cước gửi qua Telegram. Chưa duyệt thì chưa vào sổ, chưa ký được hợp đồng.</p>'+
          (cho.length?
            '<div class="cuon"><table><thead><tr><th>Họ tên</th><th>Điện thoại</th><th>CMND/CCCD</th>'+
            '<th>Nguồn</th><th>Nhận lúc</th><th>Thao tác</th></tr></thead><tbody>'+
            cho.map(function(k){
              return '<tr><td class="ten">'+esc(k.ho_ten||'—')+'</td><td>'+esc(k.sdt||'—')+'</td>'+
                '<td>'+esc(k.so_dinh_danh||'—')+'</td>'+
                '<td>'+(k.nguon==='tro_ly_ai'?'<span class="hieu-nho h-vang">Trợ Lý AI</span>':'Gõ tay')+'</td>'+
                '<td>'+ngay(k.tao_luc)+'</td>'+
                '<td><span class="cap-nut">'+
                '<button class="nut-tt" type="button" data-duyet-k="'+esc(k.id)+'">Duyệt</button>'+
                '<button class="nut-tt xoa" type="button" data-bo-k="'+esc(k.id)+'">Bỏ</button>'+
                '</span></td></tr>';
            }).join('')+'</tbody></table></div>'
            : '<div class="trang-thai">Không có hồ sơ nào chờ duyệt. Trợ Lý AI chưa gửi gì về.</div>')+
          '</div>';
      }
    }
    function ve(){
      var ds=locK();
      document.getElementById('tb-k').innerHTML = ds.map(function(k){
        var kb = k.da_khai_bao
          ? '<span class="hieu-nho h-luc">Đã khai báo'+(k.ngay_khai_bao?' '+ngay(k.ngay_khai_bao):'')+'</span>'
          : '<span class="hieu-nho h-vang">Chưa khai báo</span>';
        var nut='';
        if(laVanHanh()){
          if(k.da_xoa) nut='<button class="nut-tt" type="button" data-kl="phuc" data-id="'+esc(k.id)+'">Khôi phục</button>';
          else nut='<button class="nut-tt" type="button" data-kl="kb" data-id="'+esc(k.id)+'">'+
                     (k.da_khai_bao?'Bỏ khai báo':'Đã khai báo')+'</button>'+
                   '<button class="nut-tt" type="button" data-kl="sua" data-id="'+esc(k.id)+'">Sửa</button>'+
                   '<button class="nut-tt xoa" type="button" data-kl="xoa" data-id="'+esc(k.id)+'">Xóa</button>';
        }
        return '<tr'+(k.da_xoa?' class="da-xoa"':'')+'><td class="ten">'+esc(k.ho_ten)+
            (k.da_xoa && k.ly_do_xoa?'<br><span class="hieu-nho h-vang">Lý do xóa: '+esc(k.ly_do_xoa)+'</span>':'')+'</td>'+
          '<td>'+esc(k.sdt||'—')+'</td>'+
          '<td>'+(k.so_dinh_danh?esc(k.so_dinh_danh):'<span class="hieu-nho h-vang">Chưa có số</span>')+'</td>'+
          '<td style="white-space:nowrap">'+esc(oDau[k.id]||'—')+'</td><td>'+kb+'</td>'+
          '<td>'+(nut?'<span class="cap-nut" style="white-space:nowrap">'+nut+'</span>':'—')+'</td></tr>';
      }).join('') || '<tr><td colspan="6" style="color:var(--chu-mo)">Không có khách nào khớp bộ lọc.</td></tr>';
      var chua=ds.filter(function(k){ return !k.da_khai_bao; }).length;
      document.getElementById('chan-k').innerHTML = kXoa ? '' :
        '<span>'+ds.length+' khách khớp bộ lọc · '+(ds.length-chua)+' đã khai báo · '+chua+' chưa khai báo tạm trú.</span>';
    }
    function timK(id){ return ks.filter(function(x){ return x.id===id; })[0]; }
    function lai(){ moMan('khach'); }

    el.addEventListener('click', function(e){
      var b=e.target.closest('[data-lam]');
      if(b){
        if(b.dataset.lam==='them-khach') themKhach(lai);
        else if(b.dataset.lam==='xuat-khach') xuatKhach(kTab==='ds'?locK():duyet, oDau);
        else if(b.dataset.lam==='doi-xoa-k'){ kXoa=!kXoa; veTab('ds'); }
        return;
      }
      var q=e.target.closest('[data-kl]');
      if(q){
        var k=timK(q.dataset.id); if(!k) return;
        var viec=q.dataset.kl;
        if(viec==='sua') suaKhach(k, lai);
        else if(viec==='xoa'){
          if(oDau[k.id]){ banh(k.ho_ten+' đang thuê '+oDau[k.id]+'. Làm Trả phòng ở màn Nhà trọ trước rồi mới xóa được.'); return; }
          xoaKhach(k, lai);
        }
        else if(viec==='phuc'){
          if(!hoiLai('Khôi phục '+k.ho_ten+' về sổ khách thuê?')) return;
          ghi('khach_thue?id=eq.'+encodeURIComponent(k.id),'PATCH',{da_xoa:false})
            .then(function(){ banh('Đã khôi phục '+k.ho_ten+'.'); lai(); })
            .catch(function(er){ banh('Không khôi phục được: '+(er.message||er)); });
        }
        else if(viec==='kb'){
          var moi=!k.da_khai_bao;
          if(!hoiLai(moi ? 'Xác nhận ĐÃ khai báo tạm trú cho '+k.ho_ten+'?\n\nHệ thống ghi ngày hôm nay là ngày khai báo.'
                         : 'Chuyển '+k.ho_ten+' về CHƯA khai báo tạm trú?')) return;
          q.disabled=true;
          ghi('khach_thue?id=eq.'+encodeURIComponent(k.id),'PATCH',{da_khai_bao:moi})
            .then(function(){ banh(moi?'Đã ghi: '+k.ho_ten+' đã khai báo tạm trú.':'Đã chuyển về chưa khai báo.'); lai(); })
            .catch(function(er){ q.disabled=false; banh('Không lưu được: '+(er.message||er)); });
        }
        return;
      }
      var d=e.target.closest('[data-duyet-k],[data-bo-k]');
      if(d){
        var id=d.dataset.duyetK||d.dataset.boK, ok=!!d.dataset.duyetK;
        d.disabled=true; d.textContent=ok?'Đang duyệt…':'Đang bỏ…';
        ghi('khach_thue?id=eq.'+encodeURIComponent(id),'PATCH',
            {trang_thai_duyet: ok?'da_duyet':'da_bo'})
          .then(function(){ banh(ok?'Đã duyệt, khách vào sổ.':'Đã bỏ hồ sơ này.'); lai(); })
          .catch(function(er){ d.disabled=false; d.textContent=ok?'Duyệt':'Bỏ';
                               banh('Không xong: '+(er.message||er)); });
      }
    });

    veTab(kTab); noiTab(veTab);
  }).catch(function(e){ el.innerHTML=daiHeader('Khách thuê','')+baoLoi(e); });
}

/* ---------- Ô nhập thông tin khách: dùng chung cho Thêm và Sửa ---------- */

  return [

     chon:[['','Chưa khai'],['nam','Nam'],['nu','Nữ'],['khac','Khác']]},
    {id:'ngay_sinh', nhan:'Ngày sinh', kieu:'ngay', gt:k.ngay_sinh?String(k.ngay_sinh).slice(0,10):''},
    {id:'so_dinh_danh', nhan:'Số căn cước', gt:k.so_dinh_danh, goi:'12 chữ số. Bỏ trống được, nhưng thiếu thì chưa khai báo tạm trú được.'},
    {id:'ngay_cap', nhan:'Ngày cấp', kieu:'ngay', gt:k.ngay_cap?String(k.ngay_cap).slice(0,10):''},
    {id:'noi_cap', nhan:'Nơi cấp', gt:(k.id? k.noi_cap : 'BỘ CÔNG AN')},
    {id:'nghe_nghiep', nhan:'Nghề nghiệp', gt:k.nghe_nghiep},
    {id:'noi_cu_tru', nhan:'Nơi thường trú', rong:true, gt:k.noi_cu_tru, goiY:'Số nhà, đường, phường, tỉnh thành'},
    {id:'email', nhan:'Email', rong:true, gt:k.email},
    {id:'da_khai_bao', nhan:'Đã khai báo tạm trú', kieu:'batTat', gt:!!k.da_khai_bao,
     goi:'Bật khi đã khai báo với công an khu vực. Hệ thống tự ghi ngày khai báo, sửa được ở ô dưới.'},
    {id:'ngay_khai_bao', nhan:'Ngày khai báo tạm trú', kieu:'ngay',
     gt:k.ngay_khai_bao?String(k.ngay_khai_bao).slice(0,10):'',
     goi:'Bấm Đã khai báo lần đầu thì hệ thống tự điền ngày hôm nay. Nhập sai thì sửa lại ở đây.'}
  ];
}
function kiemKhach(g){
  if(!g.ho_ten || g.ho_ten.trim().length<2) return 'Chưa điền họ tên.';
  if(g.so_dinh_danh && !/^[0-9]{9,12}$/.test(g.so_dinh_danh))
    return 'Số căn cước chỉ gồm chữ số, 9 tới 12 số. Bỏ trống cũng được.';
  if(g.sdt && !/^[0-9\s.+()-]{8,15}$/.test(g.sdt)) return 'Số điện thoại trông không hợp lệ.';
  if(g.ngay_sinh && g.ngay_sinh > homNayVN()) return 'Ngày sinh nằm ở tương lai.';
  return null;
}
function thanKhach(g){
  return { ho_ten:g.ho_ten.trim(), sdt:g.sdt||null,
    gioi_tinh:g.gioi_tinh||null, ngay_sinh:g.ngay_sinh||null,
    so_dinh_danh:g.so_dinh_danh||null, ngay_cap:g.ngay_cap||null,
    noi_cap:g.noi_cap||null, nghe_nghiep:g.nghe_nghiep||null,
    noi_cu_tru:g.noi_cu_tru||null, email:g.email||null, da_khai_bao:!!g.da_khai_bao,
    ngay_khai_bao: g.da_khai_bao ? (g.ngay_khai_bao||null) : null };
}
function loiTrungCC(e){
  var m=String(e&&e.message||e);
  if(/đã có rồi/.test(m))
    throw new Error('Số căn cước này đã có trong sổ. Có thể khách nằm trong danh sách đã xóa — bấm "Hiện khách đã xóa" rồi Khôi phục.');
  throw e;
}

/* ---------- Thêm một khách thuê vào sổ ---------- */
function themKhach(xongThi){
  moHop({
    ten:'Thêm khách thuê',
    mo:'Ghi khách vào sổ trước. Xếp khách vào phòng nào thì làm ở màn Nhà trọ, nút Cho thuê.',
    o:oKhach(null), nutLuu:'Lưu khách', xong:'Đã thêm khách vào sổ.',
    kiem:kiemKhach,
    luu:function(g){

            ngay(k.tao_luc)];

  xuatXlsx([['Khách thuê', [['Họ và tên','Điện thoại','Số căn cước','Ngày sinh','Giới tính','Ngày cấp',

/* ---------- HÓA ĐƠN ----------
   Vòng đời: NHÁP (sửa thoải mái) → PHÁT HÀNH (gửi khách, thu tiền)
   → hoặc HỦY (muốn sửa hóa đơn đã phát hành thì hủy rồi lập lại).
   Nháp và đã hủy không nằm trong bất kỳ con số tiền nào. */
var hTab='ds', hChon=null, hLoc={nha:'', ky:'', tt:''};
var TT_HD = {
  nhap:['Nháp','h-xam'], cho_thanh_toan:['Chờ thanh toán','h-vang'], qua_han:['Quá hạn','h-do'],
  da_thanh_toan:['Đã thanh toán','h-luc'], da_huy:['Đã hủy','h-xam']
};
function maNhaHD(h){ return h.phong&&h.phong.nha_tro?h.phong.nha_tro.ma_nha:'—'; }
function maPhongHD(h){ return h.phong?h.phong.ma_phong:'—'; }
function tenKhachHD(h){ return h.hop_dong&&h.hop_dong.khach_thue?h.hop_dong.khach_thue.ho_ten:'—'; }
function laThat(h){ return h.trang_thai!=='nhap' && h.trang_thai!=='da_huy'; }
function trangThaiHD(h){
  if(h.trang_thai==='nhap' || h.trang_thai==='da_huy') return h.trang_thai;
  if(+h.con_no<=0) return 'da_thanh_toan';
  if(h.han_thanh_toan && String(h.han_thanh_toan).slice(0,10) < homNayVN()) return 'qua_han';
  return 'cho_thanh_toan';
}
function nhanTT(h){
  var t=trangThaiHD(h), x=TT_HD[t]||[t,'h-xam'];
  var them='';
  if(t==='qua_han'){
    var n=Math.round((new Date(homNayVN())-new Date(String(h.han_thanh_toan).slice(0,10)))/86400000);
    if(n>0) them=' '+n+' ngày';
  }
  return '<span class="hieu-nho '+x[1]+'">'+x[0]+them+'</span>';
}
